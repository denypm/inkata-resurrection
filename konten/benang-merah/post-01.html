<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Gochi+Hand&family=Inter:wght@400;600;800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  .post{width:1080px;height:1350px;position:relative;overflow:hidden;background:#ECE8E1;font-family:Inter,sans-serif;color:#141414}
  .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55}
  .tag{position:absolute;top:58px;font:600 26px/1 Inter;letter-spacing:.5px}
  .tag.l{left:72px}.tag.r{right:180px}
  .logo{position:absolute;top:44px;right:72px;width:78px;height:92px;background:#141414;color:#ECE8E1;display:flex;flex-direction:column;align-items:center;justify-content:center;font:400 46px/1 Anton}
  .logo small{font:800 7px/1 Inter;letter-spacing:.6px;margin-top:6px}
  .h{position:absolute;left:72px}
  .block{font-family:Anton;font-size:178px;line-height:.92;text-transform:uppercase;letter-spacing:-1px}
  .hand{font-family:'Gochi Hand';color:#C8321E;font-size:150px;line-height:1}
  .credit{position:absolute;left:72px;bottom:86px;font:600 27px/1.55 Inter}
  .credit td{padding:0 14px 0 0;vertical-align:top}
  .credit td:first-child{font-weight:800}
  .credit .q{color:#C8321E;font-weight:800}
  .cta{position:absolute;right:72px;bottom:92px;text-align:right;font:400 40px/1.1 'Gochi Hand';color:#141414}
  svg.art{position:absolute;inset:0}
</style></head>
<body>
<div class="post" id="post">
  <svg class="art" viewBox="0 0 1080 1350" width="1080" height="1350">
    <!-- the tangle -->
    <path d="M760 300 c60 -40 140 10 110 70 c-30 60 -150 30 -120 -40 c25 -60 170 -50 160 30 c-10 70 -170 80 -175 0
             c-5 -60 120 -95 165 -30 c40 60 -60 120 -130 70 c-60 -45 10 -130 90 -100 c70 30 40 120 -40 120
             c-70 0 -90 -90 -20 -110 c70 -20 130 50 80 100 c-35 35 -110 10 -95 -40 c15 -45 95 -40 100 5
             C935 470 960 520 990 560"
          fill="none" stroke="#C8321E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the thread straightens, runs down the edge and underlines "benang merah." -->
    <path d="M990 560 C1060 640 1070 870 965 912 C900 935 600 918 300 922 C180 924 120 920 95 935 C60 960 100 1015 178 1012"
          fill="none" stroke="#C8321E" stroke-width="6" stroke-linecap="round"/>
    <!-- small figure pulling the thread pulling the thread -->
    <g transform="translate(200,950)" fill="#141414">
      <circle cx="26" cy="0" r="17"/>
      <path d="M12 20 q14 -6 30 0 l10 58 l-10 4 l-2 56 l-11 0 l-3 -50 l-4 50 l-11 0 l0 -60 l-8 -2 z"/>
      <path d="M14 30 l-30 34 l6 6 l34 -28 z"/>
    </g>
  </svg>

  <div class="tag l">@penerbitbenangmerah</div>
  <div class="tag r">#UntaianPikiran</div>
  <div class="logo">BM<small>BENANG MERAH</small></div>

  <div class="h block" style="top:190px">Di antara</div>
  <div class="h hand"  style="top:360px;left:84px">yang kusut,</div>
  <div class="h block" style="top:560px">selalu ada</div>
  <div class="h hand"  style="top:740px;left:84px">benang merah.</div>

  <table class="credit">
    <tr><td>Penulis</td><td>:</td><td class="q">Kamu?</td></tr>
    <tr><td>Editor</td><td>:</td><td>Kami</td></tr>
    <tr><td>Penerbit</td><td>:</td><td>Benang Merah</td></tr>
  </table>
  <div class="cta">naskah dibuka<br>segera ✶</div>

  <svg class="grain" width="1080" height="1350">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .35 0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
</div>
</body></html>
