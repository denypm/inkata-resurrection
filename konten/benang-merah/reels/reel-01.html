<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Gochi+Hand&family=Inter:wght@600;800&display=block" rel="stylesheet">
<script src="lib.js"></script>
<style>html,body{margin:0}#post{width:1080px;height:1920px;position:relative;overflow:hidden;background:#152A3A}
svg{position:absolute;inset:0}.a{position:absolute}
.ps{font-family:'Press Start 2P'}.gh{font-family:'Gochi Hand'}
#end{position:absolute;inset:0;background:#F1E6D2;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateY(1920px)}
</style></head><body><div id="post">
<svg id="s" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
<div class="a ps" id="hudL" style="left:70px;top:150px;font-size:26px;color:#F7C65A;opacity:0">LV.01</div>
<div class="a ps" id="hudC" style="left:0;right:0;top:150px;text-align:center;font-size:26px;color:#F1E6D2;opacity:0">NASKAH <span id="score">000</span></div>
<div class="a ps" id="hudR" style="right:70px;top:150px;font-size:26px;color:#E2614A;opacity:0">♥♥♥</div>
<div class="a ps" id="selamat" style="left:0;right:0;top:300px;text-align:center;font-size:92px;color:#F7C65A;text-shadow:6px 6px 0 #C8321E;opacity:0">SELAMAT!</div>
<div class="a gh" id="type" style="left:60px;right:60px;top:430px;text-align:center;font-size:80px;line-height:1.05;color:#F1E6D2"></div>
<div class="a gh" id="reveal" style="left:60px;right:60px;top:630px;text-align:center;font-size:80px;line-height:1.05;color:#F1E6D2;opacity:0">menjaga naskahmu<br>tetap <span style="color:#F7C65A;background:#C8321E;padding:0 16px;border-radius:8px">menyala.</span></div>
<div id="end"><img src="logo-full.png" style="width:1000px;height:1000px;margin-top:-120px;mix-blend-mode:multiply;-webkit-mask-image:radial-gradient(circle,#000 52%,transparent 70%);mask-image:radial-gradient(circle,#000 52%,transparent 70%)">
<div class="ps" id="blink" style="font-size:34px;line-height:1.6;text-align:center;color:#1C1A1A;margin-top:-40px">IKUTI UNTUK<br>LEVEL BERIKUTNYA <span style="color:#C8321E">▶</span></div>
<div style="font:800 30px Inter;color:#C8321E;margin-top:40px;letter-spacing:2px">@penerbitbenangmerah</div></div>
</div>
<script>
const s=document.getElementById('s');
s.innerHTML=DEFS+`<defs><radialGradient id="glow"><stop offset="0" stop-color="#F7C65A" stop-opacity=".75"/><stop offset=".45" stop-color="#E8743B" stop-opacity=".25"/><stop offset="1" stop-color="#E8743B" stop-opacity="0"/></radialGradient></defs>
<g id="bg" filter="url(#rough)"></g><g id="stars"></g><circle id="glowc" cx="540" cy="1420" r="420" fill="url(#glow)"/>
<g id="sul"></g><g id="wind"></g><g id="table" filter="url(#rough)"></g><g id="candle"></g><g id="hands" filter="url(#wob)"></g><g id="flame"></g><g id="spark"></g>
<rect id="dark" width="1080" height="1920" fill="#05090D" opacity=".85"/>
<rect width="1080" height="1920" filter="url(#paper)" style="mix-blend-mode:multiply" opacity=".3"/>`;
seed=4;P=document.getElementById('bg');
paint('M-30 -30H1110V1950H-30Z','#152A3A',['#1D3A4F','#0E1F2C','#1E4640'],380,[10,30],[60,170],0.1);
const ST=[];P=document.getElementById('stars');
for(let i=0;i<45;i++){const x=rr(30,1050),y=rr(260,1500);const g=el('g',{});star(x,y,rr(4,11),R()<.3?C.orange:C.cream);P.lastChild&&ST.push([P.lastChild,rr(1,4),rr(0,6)]);}
// Sulam
P=document.getElementById('sul');const SG2=el('g',{id:'sulg'});P=SG2;paint('M378 1400H702V1620H378Z',C.teal,['#24534B','#183B37','#2A5C52'],60,[6,14],[30,90],0);P=document.getElementById('sul');const SI=el('g',{transform:'translate(285 773) scale(1.5)',filter:'url(#wob)'},SG2);seed=9;sulam(SI,'tenang');
// table
P=document.getElementById('table');paint('M-30 1610H1110V1950H-30Z','#7A4B26',['#8C5A30','#6A3F1F','#9C6435'],160,[6,16],[60,160],0);
paint('M-30 1590H1110V1630H-30Z','#9C6435',['#B87A45'],40,[4,8],[60,160],0);
// candle
P=document.getElementById('candle');paint('M490 1460H590V1610H490Z',C.cream,['#E7D8BD','#F7EEDD'],30,[4,8],[20,60],1.57);
el('path',{d:'M490 1470q20 14 26 40q4 -26 18 -30',fill:'#F7EEDD'});el('ellipse',{cx:540,cy:1610,rx:90,ry:16,fill:'#B87A45'});
el('path',{d:'M540 1460v-22',stroke:'#2A1A14','stroke-width':5,'stroke-linecap':'round'});
// hands
P=document.getElementById('hands');
const HL=el('g',{id:'hl'});P=HL;paint('M0 0C-40 -10 -60 30 -40 60C-20 80 20 70 26 40C30 20 20 4 0 0Z',C.skin,SK,12,[3,6],[8,20]);
P=document.getElementById('hands');const HR=el('g',{id:'hr'});P=HR;paint('M0 0C40 -10 60 30 40 60C20 80 -20 70 -26 40C-30 20 -20 4 0 0Z',C.skin,SK,12,[3,6],[8,20]);
// flame
P=document.getElementById('flame');const FL=el('g',{id:'fl'});
el('path',{d:'M0 0C-34 -18 -30 -74 0 -120C30 -74 34 -18 0 0Z',fill:'#E8743B'},FL);
el('path',{d:'M0 -4C-20 -14 -18 -52 0 -84C18 -52 20 -14 0 -4Z',fill:'#F7C65A'},FL);
el('path',{d:'M0 -8C-9 -14 -8 -32 0 -46C8 -32 9 -14 0 -8Z',fill:'#FFF6DC'},FL);
// wind lines
P=document.getElementById('wind');const WL=[];for(let i=0;i<4;i++)WL.push(el('path',{d:'M0 0C60 -30 120 30 200 0S300 -20 340 10',stroke:'#F1E6D2','stroke-width':6,fill:'none','stroke-linecap':'round',opacity:0}));
// sparks
P=document.getElementById('spark');const SP=[];for(let i=0;i<14;i++){const g=el('g',{opacity:0});const a=i/14*Math.PI*2;SP.push([g,a]);el('path',{d:'M0 -14Q0 0 14 0Q0 0 0 14Q0 0 -14 0Q0 0 0 -14Z',fill:i%2?C.yellow:C.cream},g)}
const TXT='kamu menemukan akun yang...';
const ease=(x)=>x<0?0:x>1?1:1-Math.pow(1-x,3), back=(x)=>{x=Math.max(0,Math.min(1,x));const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const cl=(x)=>Math.max(0,Math.min(1,x));
function noise(t){return Math.sin(t*13.1)*.5+Math.sin(t*7.3+1)*.3+Math.sin(t*23.7+2)*.2}
window.render=function(t){
  document.getElementById('dark').setAttribute('opacity',(.85*(1-ease((t-.1)/.8))).toFixed(3));
  for(const [e,sp,ph] of ST)e.setAttribute('opacity',(.45+.55*Math.abs(Math.sin(t*sp+ph))).toFixed(2));
  // flame
  const lit=ease((t-.1)/.4);
  let gust=0;if(t>5.0&&t<6.3)gust=Math.sin(cl((t-5.0)/1.3)*Math.PI);const guard=ease((t-5.5)/.6);
  const sk=(noise(t)*6+gust*28*(1-guard*.75)), sy=lit*(1+noise(t+3)*.08-gust*.18*(1-guard*.7)), sx=lit*(1+noise(t+5)*.05);
  document.getElementById('fl').setAttribute('transform',`translate(540 1440) skewX(${sk.toFixed(2)}) scale(${sx.toFixed(3)} ${sy.toFixed(3)})`);
  const gc=document.getElementById('glowc');gc.setAttribute('r',(lit*(380+noise(t*1.3)*30+(t>6.4&&t<7.4?120*Math.sin(cl((t-6.4))*Math.PI):0))).toFixed(1));
  // HUD
  const hud=cl((t-.6)/.3);for(const id of ['hudL','hudC','hudR'])document.getElementById(id).style.opacity=hud;
  document.getElementById('score').textContent=t>6.5?'001':'000';
  // SELAMAT pop
  const sp=back((t-.6)/.35);const se=document.getElementById('selamat');se.style.opacity=t>.6?1:0;se.style.transform=`scale(${sp.toFixed(3)})`;
  // typewriter
  const n=Math.floor(cl((t-1.4)/2.4)*TXT.length);const ty=document.getElementById('type');ty.textContent=TXT.slice(0,n)+(t>1.4&&t<4.4&&Math.floor(t*4)%2?'|':'');
  // Sulam pop-up
  const sy2=(1-back((t-4.4)/.55))*900;document.getElementById('sulg').setAttribute('transform',`translate(0 ${(t<4.4?900:sy2+Math.sin(t*2.2)*6).toFixed(1)})`);
  // wind
  WL.forEach((w,i)=>{const p=cl((t-5.0-i*.12)/.9);w.setAttribute('opacity',p>0&&p<1?(Math.sin(p*Math.PI)*.8).toFixed(2):0);w.setAttribute('transform',`translate(${(-380+p*1500).toFixed(0)} ${1310+i*45})`)});
  // hands
  const hx=(1-guard)*420;document.getElementById('hands').setAttribute('opacity',guard.toFixed(2));document.getElementById('hl').setAttribute('transform',`translate(${(470-hx).toFixed(1)} ${(1395+(1-guard)*120).toFixed(1)})`);
  document.getElementById('hr').setAttribute('transform',`translate(${(610+hx).toFixed(1)} ${(1395+(1-guard)*120).toFixed(1)})`);
  // reveal
  const rv=ease((t-6.4)/.4);const re=document.getElementById('reveal');re.style.opacity=rv;re.style.transform=`translateY(${((1-rv)*40).toFixed(1)}px)`;
  
  // sparks
  SP.forEach(([g,a])=>{const p=cl((t-6.4)/1.2);const d=60+p*360;g.setAttribute('opacity',p>0&&p<1?(1-p).toFixed(2):0);g.setAttribute('transform',`translate(${(540+Math.cos(a)*d).toFixed(1)} ${(1380+Math.sin(a)*d*.8).toFixed(1)}) scale(${(1+p).toFixed(2)})`)});
  // end card
  const ec=ease((t-8.6)/.45);document.getElementById('end').style.transform=`translateY(${((1-ec)*1920).toFixed(0)}px)`;
  document.getElementById('blink').style.opacity=t>9.1?(Math.floor(t*3)%2?1:.25):1;
};
render(0);
</script></body></html>
