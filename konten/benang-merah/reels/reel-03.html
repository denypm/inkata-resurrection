<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Gochi+Hand&family=Instrument+Serif:ital@0;1&family=Inter:wght@600;800&display=block" rel="stylesheet">
<script src="lib.js"></script>
<style>html,body{margin:0}#post{width:1080px;height:1920px;position:relative;overflow:hidden;background:#152A3A}
svg{position:absolute;inset:0}.a{position:absolute}.ps{font-family:'Press Start 2P'}.gh{font-family:'Gochi Hand'}
.ln{position:absolute;left:60px;right:60px;top:270px;text-align:center;opacity:0}
#end{position:absolute;inset:0;background:#F1E6D2;opacity:0}
.it{font:400 60px 'Gochi Hand';color:#1C1A1A;opacity:0;margin:14px 0;display:flex;gap:22px;align-items:center}
.it b{color:#C8321E;font-size:46px}
.bt{height:104px;padding:0 26px;border-radius:56px;display:flex;align-items:center;gap:14px;font:400 26px "Press Start 2P";white-space:nowrap}.bt span{font-family:Inter;font-weight:800;font-size:40px}
</style></head><body><div id="post">
<svg id="s" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
<div class="ln gh" id="l1" style="top:220px;font-size:74px;line-height:1.05;color:#F1E6D2"><span style="font-family:'Press Start 2P';font-size:54px;color:#F7C65A;text-shadow:5px 5px 0 #C8321E">SELAMAT!</span><br><span style="display:inline-block;margin-top:18px">kamu menemukan<br>akun yang...</span></div>
<div class="ln gh" id="l2" style="font-size:80px;line-height:1.05;color:#F1E6D2;top:330px">menjaga naskahmu<br>tetap <span style="color:#F7C65A;background:#C8321E;padding:0 16px;border-radius:8px">menyala.</span></div>
<div class="ln gh" id="l3" style="font-size:80px;line-height:1.05;color:#F1E6D2;top:250px">ikuti, dan mulai<br>tulis <span style="color:#F7C65A">bukumu.</span><div style="font:800 32px Inter;color:#F7C65A;margin-top:24px;letter-spacing:1px">@penerbitbenangmerah</div></div>
</div>
<script>
const s=document.getElementById('s');
s.innerHTML=DEFS+`<defs>
<radialGradient id="glow"><stop offset="0" stop-color="#FFD27A" stop-opacity=".7"/><stop offset=".35" stop-color="#E8743B" stop-opacity=".28"/><stop offset="1" stop-color="#E8743B" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter></defs>
<g id="bg" filter="url(#rough)"></g><g id="stars"></g>
<g id="sul"></g>
<circle id="facelight" cx="540" cy="1150" r="620" fill="url(#glow)" style="mix-blend-mode:screen"/>
<g id="candle"></g><g id="hands" ></g>
<circle id="glowc" cx="540" cy="1460" r="300" fill="url(#glow)"/>
<g id="flame"><path id="fo" fill="#E8743B" filter="url(#soft)" opacity=".95"/><path id="fm" fill="#F7C65A" filter="url(#soft2)"/><path id="fc" fill="#FFF6DC" filter="url(#soft2)"/><ellipse id="fb" rx="12" ry="9" fill="#7FB2E5" opacity=".55" filter="url(#soft2)"/></g>

<rect width="1080" height="1920" filter="url(#paper)" style="mix-blend-mode:multiply" opacity=".28"/>`;
seed=4;P=document.getElementById('bg');
paint('M-30 -30H1110V1950H-30Z','#152A3A',['#1D3A4F','#0E1F2C','#1E4640'],380,[10,30],[60,170],0.1);
const ST=[];P=document.getElementById('stars');
for(let i=0;i<30;i++){const x=rr(30,1050),y=rr(200,700);star(x,y,rr(4,10),R()<.3?C.orange:C.cream);ST.push([P.lastChild,rr(.6,1.8),rr(0,6)]);}
// Sulam close-up (scale 3)
P=document.getElementById('sul');const SGc=el('g',{id:'sulg'});
const SI=el('g',{transform:'translate(30 346) scale(3)',filter:'url(#wob)'},SGc);seed=9;sulam(SI,'tenang');
// candle (foreground, big)
P=document.getElementById('candle');paint('M478 1560H602V1960H478Z',C.cream,['#E7D8BD','#F7EEDD'],40,[5,10],[30,90],1.57);el('rect',{x:570,y:1560,width:32,height:400,fill:'#C9B89A',opacity:.45});el('rect',{x:478,y:1560,width:14,height:400,fill:'#fff',opacity:.35});
el('path',{d:'M478 1572q24 16 30 54q6 -36 22 -42',fill:'#F7EEDD'});el('path',{d:'M540 1560v-30',stroke:'#2A1A14','stroke-width':7,'stroke-linecap':'round'});
// hands
P=document.getElementById('hands');
const HAND='M-30 0C-36 -30 -38 -60 -36 -110Q-36 -126 -27 -126Q-19 -126 -19 -112Q-19 -140 -10 -140Q-1 -140 -1 -126Q-1 -138 8 -138Q17 -138 17 -122Q17 -120 24 -118Q32 -116 31 -102C30 -80 30 -70 30 -62C42 -70 56 -86 60 -78C64 -70 52 -50 34 -36C28 -24 26 -10 24 0Z';
function hand(id,mir){const g=el('g',{id});const inner=el('g',{transform:`scale(${mir?-1.35:1.35} 1.35)`},g);P=inner;
 paint(HAND,C.skin,['#F5DCC2','#E8C4A2','#EFCBAE'],30,[3,6],[10,30],1.5);
 el('path',{d:HAND,fill:'none',stroke:'#B5785A','stroke-width':2.2,'stroke-linejoin':'round'});
 el('path',{d:'M-19 -112L-20 -80M-1 -126L-1 -84M17 -122L15 -86',stroke:'#C98E70','stroke-width':2,'stroke-linecap':'round',fill:'none'});
 el('path',{d:'M-26 -124q4 -3 8 0M-6 -138q4 -3 8 0M12 -136q4 -3 8 0M26 -116q3 -2 6 1',stroke:'#E8C4A2','stroke-width':2.5,fill:'none'});
 el('ellipse',{cx:-4,cy:-40,rx:16,ry:10,fill:'#EE8F6A',opacity:.25});
 P=document.getElementById('hands');return g}
P=document.getElementById('hands');hand('hl',false);hand('hr',true);
const L=10, W0=2*Math.PI/L;
const cl=x=>Math.max(0,Math.min(1,x));
// periodic noise: integer harmonics of the loop length => seamless
const pn=(t,ks,ph)=>{let v=0,a=0;ks.forEach((k,i)=>{const w=1/(i+1);v+=Math.sin(W0*k*t+ph+i*1.7)*w;a+=w});return v/a};
function fpath(w,h,dx){return `M0 0C${-w} ${-h*.12} ${-w*.75+dx*.3} ${-h*.62} ${dx} ${-h}C${w*.75+dx*.3} ${-h*.62} ${w} ${-h*.12} 0 0Z`}
const BX=540,BY=1530;
window.render=function(t){
  t=((t%L)+L)%L;
  for(const [e,sp,ph] of ST){const k=Math.max(1,Math.round(sp*2));e.setAttribute('opacity',(.35+.5*Math.abs(Math.sin(W0*k*t/2+ph))).toFixed(2));}
  const sway=pn(t,[2,5,9],0)*10, fl=1+pn(t,[23,37,51],1)*.07+pn(t,[3,7],2)*.05;
  const H=230*fl, W=60*(1+pn(t,[17,29],3)*.06);const g=`translate(${BX} ${BY})`;
  for(const [id,ws,hs,ss,dy] of [['fo',1,1,1,0],['fm',.66,.72,.7,0],['fc',.32,.36,.35,2]]){const e=document.getElementById(id);e.setAttribute('d',fpath(W*ws,H*hs,sway*ss));e.setAttribute('transform',`translate(${BX} ${BY-dy})`);}
  const fb=document.getElementById('fb');fb.setAttribute('cx',BX);fb.setAttribute('cy',BY-6);
  document.getElementById('glowc').setAttribute('r',(300*(.75+.25*fl)).toFixed(1));
  document.getElementById('facelight').setAttribute('opacity',(.55+(fl-1)*1.4).toFixed(3));
  const br=Math.sin(W0*3*t)*4;document.getElementById('sulg').setAttribute('transform',`translate(0 ${br.toFixed(1)})`);
  const hb=Math.sin(W0*3*t+.6)*5;
  document.getElementById('hl').setAttribute('transform',`translate(430 ${(1640+hb).toFixed(1)}) rotate(10)`);
  document.getElementById('hr').setAttribute('transform',`translate(650 ${(1640+hb).toFixed(1)}) rotate(-10)`);
  const seg=(a,b)=>cl(Math.min((t-a)/.4,(b-t)/.4));
  document.getElementById('l1').style.opacity=seg(0,3.3);
  document.getElementById('l2').style.opacity=seg(3.4,6.7);
  document.getElementById('l3').style.opacity=seg(6.8,10);
};
render(0);
</script></body></html>
