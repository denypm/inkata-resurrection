<div class="tx" id="t1" style="right:60px;top:240px;font-size:100px;transform:rotate(-4deg)">TUNGGU, SULAM!</div>

<div class="tx" style="right:64px;top:550px;font:800 24px Inter;letter-spacing:1px;color:#C8321E;text-shadow:0 0 10px #F3EEE4">#SelamatkanSulam · @penerbitbenangmerah</div>
</div><script>
const L=10,W0=2*Math.PI/L,mod=(a,b)=>((a%b)+b)%b;
const s=document.getElementById('s');
s.innerHTML=DEFS+`<defs><filter id="mb" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="0 8"/></filter></defs>
<g id="cam"><g id="wall" filter="url(#mb)"></g><g id="wind"></g><g id="legs"></g><g id="head"></g><g id="torso"></g><g id="arms"></g><g id="fly"></g></g>
<rect width="1080" height="1920" filter="url(#paper)" style="mix-blend-mode:multiply" opacity=".28"/>`;
const WALL=document.getElementById('wall');seed=5;const TILE=el('g',{},WALL);P=el('g',{filter:'url(#rough)'},TILE);
paint('M-20 0H1100V960H-20Z','#D9C8A9',['#CDBB99','#E3D4B8','#D2C09F'],160,[8,20],[60,180],1.57);
const winC=['#5E8CA8','#4E7C98','#6E9CB8'];
for(let r=0;r<4;r++)for(const x of [70,425,780]){const y=r*240+44;const lit=((r*3+x)%5)==1;
 paint(`M${x-10} ${y-10}H${x+240}V${y+166}H${x-10}Z`,'#EFE6D4',['#E7DCC6'],10,[3,6],[20,60],0);
 paint(`M${x} ${y}H${x+230}V${y+150}H${x}Z`,lit?'#F7C65A':winC[(r+x)%3],lit?['#F3B84A','#FAD77E']:winC,24,[4,10],[20,60],1.57);
 el('path',{d:`M${x+115} ${y}V${y+150}M${x} ${y+60}H${x+230}`,stroke:'#EFE6D4','stroke-width':8});}
for(const k of [1,2]){WALL.appendChild(TILE.cloneNode(true))}
const WN=[];P=document.getElementById('wind');for(let i=0;i<26;i++)WN.push([el('path',{stroke:'#FFFFFF','stroke-width':rr(2,5),'stroke-linecap':'round',opacity:rr(.3,.6),fill:'none'}),rr(20,1060),rr(140,360),rr(0,1)]);
// ---------- Utas upside down, back arched (C-curve: head bottom, belly right, feet top-left) ----------
const DY=120; // shift whole figure down
const T=(d)=>d.replace(/(-?\d+(\.\d+)?) (-?\d+(\.\d+)?)/g,(m,x,_,y)=>`${x} ${(+y+DY)}`);
P=el('g',{filter:'url(#rough)'},document.getElementById('legs'));
const LEGS=[[495,740,360,610,200,520,-1],[600,735,450,560,300,440,1]];
for(const [hx,hy,kx,ky,fx,fy] of LEGS){el('path',{d:T(`M${hx} ${hy}L${kx} ${ky}L${fx} ${fy}`),stroke:'#A9C6CC','stroke-width':74,'stroke-linecap':'round','stroke-linejoin':'round',fill:'none'});
 el('path',{d:T(`M${fx+ (kx-fx)*.18} ${fy+(ky-fy)*.18}L${fx} ${fy}`),stroke:'#C6DDE0','stroke-width':78,'stroke-linecap':'butt'});
 const a=Math.atan2(fy-ky,fx-kx)*180/Math.PI;const g=el('g',{transform:`translate(${fx} ${fy+DY}) rotate(${a+90})`});const kp=P;P=g;
 paint('M-14 -6H14V8H-14Z',C.red,[],0);paint('M-30 -40C-34 -70 30 -76 32 -40L30 -4H-30Z','#F1E6D2',['#E7D8BD','#F7EEDD'],10,[3,6],[10,30]);
 el('path',{d:'M-34 -76H34',stroke:'#D8CBB0','stroke-width':12,'stroke-linecap':'round',transform:'translate(0 0)'});for(const y of [-20,-32])el('path',{d:`M-10 ${y}h20`,stroke:C.red,'stroke-width':4});P=kp}
// head (upside down)
P=document.getElementById('head');const HG=el('g',{});const HI=el('g',{filter:'url(#wob)'},HG);seed=9;utas2(HI,'angin');
// torso (arched sweater) drawn over head-bust
P=el('g',{filter:'url(#rough)'},document.getElementById('torso'));
paint(T('M400 1110Q560 910 450 725L640 715Q790 930 660 1130Q540 1160 400 1110Z'),C.sage,SG,170,[5,12],[30,90],1.2);
paint(T('M445 722L642 712L650 752L452 765Z'),'#6F8064',['#7D8E72'],10,[3,6],[20,60],0);
P=document.getElementById('torso');
el('path',{d:T('M470 990Q590 1010 720 960'),stroke:C.red,'stroke-width':6,'stroke-dasharray':'14 10',fill:'none','stroke-linecap':'round'});
el('path',{d:T('M455 1118Q540 1140 625 1124'),stroke:'#F8F4EC','stroke-width':12,fill:'none','stroke-linecap':'round'});
// arms reaching down past the head
const HAND='M-30 0C-36 -30 -38 -60 -36 -110Q-36 -126 -27 -126Q-19 -126 -19 -112Q-19 -140 -10 -140Q-1 -140 -1 -126Q-1 -138 8 -138Q17 -138 17 -122Q17 -120 24 -118Q32 -116 31 -102C30 -80 30 -70 30 -62C42 -70 56 -86 60 -78C64 -70 52 -50 34 -36C28 -24 26 -10 24 0Z';
const AR=[];for(const [sx,sy,hx,hy,m] of [[425,1080,400,1560,1],[640,1100,700,1580,-1]]){P=document.getElementById('arms');const g=el('g',{});
 const sl=el('path',{stroke:'#7D8E72','stroke-width':66,'stroke-linecap':'round',fill:'none',filter:'url(#rough)'},g);const cf=el('path',{stroke:'#6F8064','stroke-width':70,fill:'none'},g);
 const hg=el('g',{filter:'url(#wob)'},g);const kp=P;P=hg;paint(HAND,C.skin,['#F5DCC2','#E8C4A2'],18,[3,6],[10,30],1.5);el('path',{d:HAND,fill:'none',stroke:'#B5785A','stroke-width':3});
 el('path',{d:'M-19 -112L-20 -80M-1 -126L-1 -84M17 -122L15 -86',stroke:'#C98E70','stroke-width':3,fill:'none'});P=kp;AR.push({sl,cf,hg,sx,sy:sy+DY,hx,hy:hy+DY,m})}
// flying papers, pencil, tote
P=document.getElementById('fly');const FL=[];
for(let i=0;i<6;i++){const g=el('g',{});el('rect',{x:-40,y:-52,width:80,height:104,fill:'#F8F4EC',stroke:'#2A1A14','stroke-width':2},g);for(let k=0;k<5;k++)el('path',{d:`M-28 ${-36+k*16}h${k==4?30:56}`,stroke:'#9A8A72','stroke-width':3},g);FL.push([g,rr(60,1020),rr(0,1),Math.round(rr(1,3)),rr(.6,1)])}
const PEN=el('g',{});el('rect',{x:-60,y:-9,width:110,height:18,fill:'#F2C14E',stroke:'#2A1A14','stroke-width':2},PEN);el('path',{d:'M50 -9L74 0L50 9Z',fill:'#E6B898',stroke:'#2A1A14','stroke-width':2},PEN);el('rect',{x:-72,y:-9,width:12,height:18,fill:'#E39A80'},PEN);
const TOTE=el('g',{});const tk=P;P=TOTE;paint('M-46 -56H46L52 56H-52Z','#E7D8BD',['#DCCCAE'],14,[3,6],[20,40],1.57);el('text',{x:0,y:12,'text-anchor':'middle','font-family':'Inter','font-weight':800,'font-size':22,fill:C.red}).textContent='BM';
el('path',{d:'M-30 -56C-30 -96 30 -96 30 -56',stroke:'#C9B89A','stroke-width':8,fill:'none'});P=tk;
window.render=function(t){t=mod(t,L);
 const shx=Math.sin(W0*37*t)*3,shy=Math.cos(W0*31*t)*3;document.getElementById('cam').setAttribute('transform',`translate(${shx.toFixed(1)} ${shy.toFixed(1)})`);
 const off=mod(1440*t,960);let i=0;WALL.childNodes.forEach(n=>{if(n.tagName==='g'){n.setAttribute('transform',`translate(0 ${(i*960-off).toFixed(1)})`);i++}});
 WN.forEach(([e,x,len,ph])=>{const y=mod(ph*2400-2400*t,2400)-400;e.setAttribute('d',`M${x} ${y.toFixed(1)}v${len}`)});
 const sw=Math.sin(W0*2*t)*2;
 HG.setAttribute('transform',`translate(${528} ${1268+DY}) rotate(${(178+sw).toFixed(2)}) scale(1.3) translate(-170 -190)`);
 AR.forEach((a,k)=>{const dx=Math.sin(W0*4*t+k)*12,dy=Math.cos(W0*4*t+k)*10;const hx=a.hx+dx,hy=a.hy+dy;const mx=(a.sx+hx)/2-a.m*50,my=(a.sy+hy)/2;
  a.sl.setAttribute('d',`M${a.sx} ${a.sy}Q${mx} ${my} ${hx} ${hy-60}`);a.cf.setAttribute('d',`M${(hx+(mx-hx)*.12).toFixed(1)} ${(hy-60+(my-hy)*.12).toFixed(1)}L${hx} ${hy-60}`);
  a.hg.setAttribute('transform',`translate(${hx.toFixed(1)} ${(hy-70).toFixed(1)}) rotate(${180+a.m*8}) scale(${.85*a.m} .85)`)});
 FL.forEach(([g,x,ph,k,sc])=>{const y=mod(ph*2600-1300*t,2600)-300;g.setAttribute('transform',`translate(${(x+Math.sin(W0*k*t+ph*6)*40).toFixed(1)} ${y.toFixed(1)}) rotate(${(t*72*k+ph*360).toFixed(1)}) scale(${sc})`)});
 const py=mod(.3*2600-1300*t,2600)-300;PEN.setAttribute('transform',`translate(${(880+Math.sin(W0*2*t)*30).toFixed(1)} ${py.toFixed(1)}) rotate(${(t*108).toFixed(1)}) scale(1.3)`);
 TOTE.setAttribute('transform',`translate(${(820+Math.sin(W0*3*t)*20).toFixed(1)} ${(820+Math.cos(W0*3*t)*16).toFixed(1)}) rotate(${(Math.sin(W0*5*t)*16-10).toFixed(1)}) scale(.85)`);
};
render(0);
</script></body></html>
