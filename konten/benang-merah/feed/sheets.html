<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Instrument+Serif:ital@0;1&family=Inter:wght@700;800&display=block" rel="stylesheet">
<script src="lib.js"></script><script src="fullbody.js"></script>
<style>html,body{margin:0}#post{position:relative;overflow:hidden;background:#F3EEE4;color:#2A1A14}svg{position:absolute;inset:0}.a{position:absolute}.n{position:absolute;font:400 28px/1.05 'Gochi Hand'}
.t{position:absolute;font:400 112px/0.9 'Instrument Serif';letter-spacing:-4px}.t i{color:#C8321E}.st{position:absolute;font:700 16px Inter;letter-spacing:4px}</style></head><body>
<div id="post"><svg id="s"></svg><div id="ov"></div></div>
<script>
const [who,fmt]=location.hash.slice(1).split('-');const W=1080,H=fmt=='story'?1920:1350;
const post=document.getElementById('post');post.style.width=W+'px';post.style.height=H+'px';
const s=document.getElementById('s');s.setAttribute('viewBox',`0 0 ${W} ${H}`);s.setAttribute('width',W);s.setAttribute('height',H);
s.innerHTML=DEFS+`<g id="bg" filter="url(#rough)"></g><g id="fig"></g><g id="heads"></g><g id="notes"></g><rect width="${W}" height="${H}" filter="url(#paper)" style="mix-blend-mode:multiply" opacity=".3"/>`;
seed=4;P=document.getElementById('bg');paint(`M-30 -30H${W+30}V${H+30}H-30Z`,'#F3EEE4',['#EAE2D3','#F7F2EA'],fmt=='story'?220:160,[10,30],[60,160],0.05);
const ov=document.getElementById('ov');const add=(html)=>ov.insertAdjacentHTML('beforeend',html);
const FIG=document.getElementById('fig');
const place=(fn,expr,cx,gy,sc)=>{const g=el('g',{transform:`translate(${cx} ${gy-1192*sc}) scale(${sc})`},FIG);fn(g,expr);return g};
const ground=(x0,x1,y)=>{P=FIG;el('path',{d:`M${x0} ${y}C${x0+200} ${y-6} ${x0+400} ${y+4} ${(x0+x1)/2} ${y-2}S${x1-100} ${y+2} ${x1} ${y-3}`,stroke:'#2A1A14','stroke-width':2,fill:'none',opacity:.45,filter:'url(#wob)'})};
const heads=(fn,list,pos,sc)=>{P=document.getElementById('heads');list.forEach((e,i)=>{const [x,y]=pos[i];const g=el('g',{transform:`translate(${x-170*sc} ${y}) scale(${sc})`,filter:'url(#wob)'},document.getElementById('heads'));seed=9;fn(g,e);
  P=document.getElementById('heads');el('rect',{x:x-150,y:y+235*sc/0.62,width:300,height:200*sc/0.62,fill:'#F3EEE4'})})};
const ar=d=>{P=document.getElementById('notes');el('path',{d,stroke:'#2A1A14','stroke-width':2.2,fill:'none','stroke-dasharray':'2 7','stroke-linecap':'round'})};
const D={sulam:{name:'Sulam',role:'EDITOR · PENERBIT BENANG MERAH',fn:sulamFull,hf:sulam,ex:['tenang','terkesan','mengedip'],
  notes:[['syal bergaris<br>kunyit & merah',470,'M210 520C260 500 300 470 340 440'],['tas selempang<br>berisi benang',740,'M210 790C240 790 250 790 270 790'],['kaus kaki melorot<br>& bot bertali',1010,'M210 1060C260 1080 330 1090 370 1090']],
  right:['mantel wol<br>kancing toggle',640,'M560 690C540 680 520 660 500 650']},
 utas:{name:'Utas',role:'PENULIS · PENERBIT BENANG MERAH',fn:utasFull,hf:utas2,ex:['senang','ide','bingung'],
  notes:[['rambut berantakan,<br>benang & pensil',300,'M230 340C270 330 300 300 330 280'],['tumpukan naskah<br>yang dipeluk',620,'M230 660C270 650 300 630 330 620'],['celana lebar digulung<br>& sepatu kanvas',1010,'M250 1060C290 1080 320 1100 340 1110']],
  right:['tas kanvas<br>penuh kertas',540,'M640 590C610 620 590 650 580 670']}};
if(who!=='duo'){const d=D[who];
 if(fmt=='feed'){
  add(`<div class="t" style="left:60px;top:46px">${d.name}<i>.</i></div><div class="st" style="left:66px;top:156px">${d.role}</div>`);
  place(d.fn,d.ex[0],400,1192,1);ground(100,820,1192);
  heads(d.hf,d.ex,[[910,60],[910,390],[910,720]],.62);d.ex.forEach((e,i)=>add(`<div class="n" style="left:800px;top:${375+i*330}px;width:220px;text-align:center">${e}</div>`));
  d.notes.forEach(([t,y,p])=>{add(`<div class="n" style="left:40px;top:${y}px;width:220px">${t}</div>`);ar(p)});add(`<div class="n" style="left:${who=='utas'?650:560}px;top:${d.right[1]}px;width:200px">${d.right[0]}</div>`);ar(d.right[2]);
  add(`<div class="st" style="left:66px;bottom:40px;font-size:15px;letter-spacing:3px">LEMBAR KARAKTER · @PENERBITBENANGMERAH</div>`);
 }else{
  add(`<div class="t" style="left:0;right:0;top:210px;text-align:center;font-size:130px">${d.name}<i>.</i></div><div class="st" style="left:0;right:0;top:340px;text-align:center;font-size:20px">${d.role}</div>`);
  place(d.fn,d.ex[0],540,1380,.95);ground(160,920,1380);
  heads(d.hf,d.ex,[[220,1400],[540,1400],[860,1400]],.5);d.ex.forEach((e,i)=>add(`<div class="n" style="left:${120+i*320}px;top:1640px;width:200px;text-align:center">${e}</div>`));
  add(`<div class="st" style="left:0;right:0;top:1700px;text-align:center;font-size:16px;letter-spacing:3px">@PENERBITBENANGMERAH</div>`);
 }
}else{
 if(fmt=='feed'){
  add(`<div class="t" style="left:0;right:0;top:50px;text-align:center;font-size:96px">Kenalan dengan <i>Utas & Sulam.</i></div>`);
  place(utasFull,'senang',300,1210,.92);place(sulamFull,'mengedip',780,1210,.92);ground(60,1020,1210);
  add(`<div class="n" style="left:150px;top:180px;width:300px;text-align:center">si penulis ✍️</div><div class="n" style="left:630px;top:180px;width:300px;text-align:center">si editor 🧵</div>`);
  add(`<div class="st" style="left:0;right:0;bottom:44px;text-align:center;font-size:15px;letter-spacing:3px">PENERBIT BENANG MERAH · @PENERBITBENANGMERAH</div>`);
 }else{
  add(`<div class="t" style="left:60px;right:60px;top:220px;text-align:center;font-size:104px;line-height:.95">Kenalan dengan<br><i>Utas & Sulam.</i></div>`);
  place(utasFull,'senang',300,1560,1);place(sulamFull,'mengedip',780,1560,1);ground(40,1040,1560);
  add(`<div class="n" style="left:150px;top:450px;width:300px;text-align:center">si penulis ✍️</div><div class="n" style="left:630px;top:450px;width:300px;text-align:center">si editor 🧵</div>`);
  add(`<div class="a" style="left:0;right:0;top:1620px;text-align:center;font:400 44px 'Gochi Hand'">teman perjalanan naskahmu</div>`);
  add(`<div class="st" style="left:0;right:0;top:1700px;text-align:center;font-size:18px;letter-spacing:3px">@PENERBITBENANGMERAH</div>`);
 }
}
</script></body></html>
