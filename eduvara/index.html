<style>
/* Layout: app shell with top bar + content column; exam mode takes over the screen like a CBT room. */
:root{
  --ink:#14211d;
  --muted:#5a6b65;
  --paper:#f2f5fa;
  --card:#ffffff;
  --line:#dde6e2;
  --brand:#1767c2;
  --brand-ink:#ffffff;
  --brand-soft:#e3effc;
  --cta:#ee6a12; --cta-ink:#ffffff;
  --hdr:linear-gradient(100deg,#1767c2 0%,#1596c4 60%,#1aa9b8 100%);
  --hero:linear-gradient(160deg,#2a8fd6 0%,#3a7be0 55%,#4b63e6 100%);
  --badge:#4a4ee6;
  --accent:#e8a33a;
  --accent-soft:#fdf1dd;
  --good:#1d8a4e; --good-soft:#e3f5ea;
  --bad:#c8443a; --bad-soft:#fbe7e5;
  --warn:#b7791f; --warn-soft:#fdf3dc;
  --shadow:0 1px 2px rgba(20,33,29,.06),0 4px 16px rgba(20,33,29,.05);
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e6efeb; --muted:#9db0a9; --paper:#0f1614; --card:#17211e; --line:#2a3833;
    --brand:#6aaef5; --brand-ink:#08182b; --brand-soft:#16273d; --cta:#f07a28; --hdr:linear-gradient(100deg,#123f75 0%,#105f7f 100%); --hero:linear-gradient(160deg,#173f73 0%,#24318a 100%); --badge:#5a5ef0;
    --accent:#f0b552; --accent-soft:#3a2d16;
    --good:#4cc47f; --good-soft:#163524; --bad:#ef7a70; --bad-soft:#3c1d1a; --warn:#e3b04f; --warn-soft:#3a2f17;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e6efeb; --muted:#9db0a9; --paper:#0f1614; --card:#17211e; --line:#2a3833;
  --brand:#6aaef5; --brand-ink:#08182b; --brand-soft:#16273d; --cta:#f07a28; --hdr:linear-gradient(100deg,#123f75 0%,#105f7f 100%); --hero:linear-gradient(160deg,#173f73 0%,#24318a 100%); --badge:#5a5ef0;
  --accent:#f0b552; --accent-soft:#3a2d16;
  --good:#4cc47f; --good-soft:#163524; --bad:#ef7a70; --bad-soft:#3c1d1a; --warn:#e3b04f; --warn-soft:#3a2f17;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow-x:clip}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:28px;font-weight:800}
h2{font-size:21px;font-weight:800}
h3{font-size:16px;font-weight:600;font-family:var(--f-body)}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--hdr);color:#fff;box-shadow:0 2px 10px rgba(10,40,90,.15)}
.topbar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:22px;color:#fff;text-decoration:none;letter-spacing:-.01em}
.logo-mark{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.95);color:#1767c2;display:grid;place-items:center;font-size:16px}
.logo small{font-family:var(--f-body);font-weight:600;font-size:11px;opacity:.85;margin-left:-4px;align-self:flex-end;margin-bottom:3px}
.hdr-cta{flex:0 0 auto;padding:5px;border-radius:99px;background:rgba(255,255,255,.25);text-decoration:none}
.hdr-cta span{display:block;background:#fff;color:#14233a;font-weight:700;font-size:14px;padding:8px 18px;border-radius:99px;white-space:nowrap}
.hdr-cta:hover span{background:#f3f8ff}
.promo{background:linear-gradient(90deg,#fde4c2,#fbeed2 50%,#fde4c2)}
.promo-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;text-decoration:none}
.promo-box{flex:1;background:#f6cd1f;border-radius:4px;padding:7px 12px;text-align:center;color:#1d2a3a;font-family:var(--f-display);font-weight:800;line-height:1.2;box-shadow:inset 0 0 0 2px rgba(0,0,0,.04)}
.promo-box b{display:block;font-size:17px;letter-spacing:.01em}
.promo-box small{font-size:12px;letter-spacing:.02em}
.promo-go{flex:0 0 40px;height:40px;border-radius:50%;background:#14233a;color:#fff;display:grid;place-items:center}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto}
.nav a{padding:8px 12px;border-radius:99px;text-decoration:none;color:rgba(255,255,255,.85);font-weight:600;font-size:14px;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.14);color:#fff}
.nav a[aria-current="page"]{background:rgba(255,255,255,.22);color:#fff}
.who{font-size:13px;color:rgba(255,255,255,.85);white-space:nowrap}
@media (max-width:1180px){.who{display:none}}
button.hdr-cta{border:0;cursor:pointer;font:inherit}
.hdr-out{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.hdr-out:hover{background:rgba(255,255,255,.15)}
#authbox{display:flex;align-items:center}
@media (max-width:760px){body.anon #hdrcta{display:none}.topbar-in{gap:10px}#authbox{margin-left:auto}}
@media (max-width:760px){.topbar-in{justify-content:space-between}.hdr-cta span{font-size:13px;padding:8px 14px}}
.bottomnav{display:none}
@media (max-width:760px){
  .nav,.who{display:none}
  .bottomnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:8px}
  .bottomnav a svg{width:20px;height:20px}
  .bottomnav a[aria-current="page"]{color:var(--brand)}
  main{padding-bottom:84px !important}
}

main{max-width:1120px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:20px}
.banner{padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:14px}
.banner.info{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 30%,transparent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2:not(.keep),.g3{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);transition:background .15s}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#2a1a00}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--paper);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--warn);border-color:transparent}

/* hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero-main{background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero-main h1{color:inherit}
.hero-main p{opacity:.88;max-width:52ch}
.hero-main .btn{background:var(--brand-ink);color:var(--brand);border-color:transparent}
.hero-main .btn.ghost{background:transparent;color:inherit;border-color:color-mix(in srgb,var(--brand-ink) 45%,transparent)}
.hero-dots{position:absolute;right:-30px;top:-30px;width:180px;height:180px;opacity:.13;background-image:radial-gradient(currentColor 2px,transparent 2px);background-size:16px 16px;border-radius:50%}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.stat .k{font-size:13px;color:var(--muted)}

/* ===== beranda ala katalog ===== */
.home-hero{width:100vw;margin:0 0 0 calc(50% - 50vw);background:var(--hero);color:#fff;position:relative;overflow:hidden;padding:28px 20px 74px}
.home-hero:first-child{margin-top:-24px}
.home-hero::before,.home-hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.home-hero::before{width:420px;height:420px;right:-120px;top:-160px}
.home-hero::after{width:260px;height:260px;left:-110px;bottom:-140px}
.hh-in{position:relative;z-index:1;max-width:1088px;margin:0 auto;display:grid;grid-template-columns:1.3fr 1fr;gap:12px;align-items:center}
.hh-in h1{font-size:32px;line-height:1.25;color:#fff;max-width:20ch}
.hh-in p{opacity:.92;margin-top:10px;font-size:16px;max-width:46ch}
.hh-pill{margin-top:18px;display:flex;align-items:center;background:#fff;border-radius:99px;padding:5px 5px 5px 8px;max-width:480px;box-shadow:0 8px 24px rgba(10,30,80,.18)}
.hh-pill .jb{flex:1;border:0;background:transparent;color:#14233a;font-weight:700;font-size:16px;text-align:left;padding:8px 12px;display:flex;align-items:center;gap:6px;min-width:0}
.hh-pill .jb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--cta);color:var(--cta-ink);border:0;border-radius:99px;font-weight:800;text-decoration:none;font-family:var(--f-body);transition:filter .15s}
.cta:hover{filter:brightness(1.07)}
.cta[disabled]{opacity:.55;cursor:not-allowed}
.hh-pill .cta{padding:13px 22px;font-size:17px;white-space:nowrap}
.hh-art{justify-self:end;width:100%;max-width:330px}
@media (max-width:760px){
  .home-hero{padding:22px 18px 70px}
  .hh-in{grid-template-columns:1fr}
  .hh-in h1{font-size:26px}
  .hh-in p{font-size:15px;max-width:30ch}
  .hh-art{display:none}
  .hh-in>div:first-child{position:relative;z-index:1}
  .hh-pill .cta{padding:12px 16px;font-size:15px}
  .hh-pill .jb{font-size:15px}
}
.svc{background:var(--card);border-radius:22px;margin-top:-56px;position:relative;z-index:2;padding:18px 16px 16px;box-shadow:0 6px 24px rgba(15,40,80,.08);border:1px solid var(--line)}
.svc h2{font-family:var(--f-body);font-size:16px;font-weight:700;margin:0 4px 14px}
.svc-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.svc-row a{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-size:14px;text-align:center;line-height:1.35;padding:4px 2px;border-radius:12px}
.svc-row a:hover{background:var(--paper)}
.svc-ic{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--t) 16%,var(--card))}
.svc-ic svg{width:34px;height:34px}
.svc-ic em{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;font-weight:800;color:#fff;background:linear-gradient(90deg,#e8382e,#e54aa5);padding:1px 7px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
@media (max-width:520px){.svc-row a{font-size:12.5px}.svc-ic{width:56px;height:56px}.svc-ic svg{width:28px;height:28px}}
.pop-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.pop-h h2{font-family:var(--f-body);font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
.jsel{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-weight:600;font-size:17px}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.pgrid{gap:10px}}
.pcard{border-radius:22px;background:color-mix(in srgb,var(--t) 20%,var(--card));display:flex;flex-direction:column;overflow:hidden;position:relative}
.pcard::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-80px;top:-70px;background:color-mix(in srgb,var(--card) 35%,transparent)}
.pc-top{position:relative;padding:18px 18px 0;display:flex;flex-direction:column;gap:10px;flex:1}
.pbadge{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;background:var(--badge);color:#fff;border-radius:99px;padding:7px 14px 7px 10px;font-weight:600;font-size:14px;line-height:1.2}
.pbadge svg{width:20px;height:20px;flex:0 0 20px}
.pc-kick{font-weight:600;font-size:16px;color:var(--ink);opacity:.85}
.pc-top h3{font-family:var(--f-body);font-size:21px;font-weight:700;line-height:1.4}
.pc-art{display:flex;justify-content:center;align-items:flex-end;height:120px;margin-top:auto}
.pc-art svg{height:116px;width:auto}
.pc-body{position:relative;background:var(--card);border-radius:20px 20px 0 0;margin:0;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;flex:0 0 auto}
.pc-lbl{color:var(--muted);font-weight:600;font-size:14px}
.pc-big{font-family:var(--f-body);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.pc-big small{font-size:15px;font-weight:600;color:var(--muted)}
.pc-tag{display:inline-block;color:#e2352b;background:#fde7e5;font-weight:700;font-size:13px;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:3px}
.pc-body .cta{padding:13px 10px;font-size:18px;width:100%}
.pc-ben{display:flex;gap:9px;font-size:14px;align-items:flex-start;line-height:1.45}
.pc-ben svg{flex:0 0 22px;height:22px;color:#1e9e57}
.pc-more{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--brand);font-weight:700;font-size:17px;text-decoration:none;padding:8px 0 2px;margin-top:auto}
.pc-bar{height:7px;border-radius:9px;background:var(--paper);overflow:hidden}.pc-bar span{display:block;height:100%;background:var(--cta);border-radius:9px}
@media (max-width:560px){
  .pc-top{padding:14px 12px 0;gap:8px}
  .pbadge{font-size:12px;padding:6px 10px 6px 8px}.pbadge svg{width:16px;height:16px;flex-basis:16px}
  .pc-kick{font-size:13.5px}
  .pc-top h3{font-size:16px}
  .pc-art{height:92px}.pc-art svg{height:90px}
  .pc-body{padding:14px 12px 12px;gap:10px}
  .pc-lbl{font-size:12.5px}.pc-big{font-size:19px}.pc-big small{font-size:12px}
  .pc-body .cta{font-size:15px;padding:11px 6px}
  .pc-ben{font-size:12.5px}.pc-more{font-size:15px}
}
.sticker{position:fixed;right:14px;bottom:24px;z-index:30;width:118px;text-decoration:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25));transform:rotate(-6deg)}
.sticker svg{width:100%;height:auto;display:block}
.sticker-x{position:fixed;right:10px;bottom:132px;z-index:31;width:24px;height:24px;border-radius:50%;border:0;background:rgba(20,35,58,.75);color:#fff;font-size:14px;line-height:1;display:grid;place-items:center}
@media (max-width:760px){.sticker{bottom:80px;width:78px}.sticker-x{bottom:150px}}
.sheet-bg{position:fixed;inset:0;z-index:85;background:rgba(10,25,45,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);border-radius:24px;padding:26px 26px 30px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}
.sheet h2{font-family:var(--f-body);font-size:24px;font-weight:800}
.sheet .sub{font-size:17px;color:var(--ink);opacity:.85;margin-top:4px}
.sheet-x{position:absolute;right:18px;top:20px;border:0;background:transparent;font-size:28px;line-height:1;color:var(--muted);padding:4px 8px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:14px 10px;font-weight:600;font-size:19px;display:flex;flex-direction:column;align-items:center;gap:6px}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.chip[disabled]{color:var(--muted);cursor:not-allowed}
.chip em{font-style:normal;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(90deg,#e8382e,#e54aa5);padding:2px 10px;border-radius:99px}
.sheet h3{margin-top:26px;font-size:17px;font-weight:500}
.sheet .note{margin-top:14px;font-size:13px;color:var(--muted)}
@media (max-width:760px){
  .sheet-bg{align-items:flex-end;padding:0}
  .sheet{border-radius:24px 24px 0 0;max-width:none;padding:24px 22px calc(28px + env(safe-area-inset-bottom))}
}

/* ===== fitur tambahan ===== */
.svc8{grid-template-columns:repeat(8,1fr)}
@media (max-width:760px){.svc8{grid-template-columns:repeat(4,1fr);row-gap:14px}}
.stars{display:inline-flex;gap:1px;font-size:18px;line-height:1}.stars i{font-style:normal;color:var(--line)}.stars i.on{color:#f2b51d}
.babgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.babcard{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:left;box-shadow:var(--shadow)}
.babcard:hover{border-color:var(--brand)}
.babic{flex:0 0 46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:18px;color:var(--t);background:color-mix(in srgb,var(--t) 14%,var(--card))}
.rangkuman{max-width:75ch}.rangkuman p,.rangkuman ul,.rangkuman ol{margin:0 0 10px}.rangkuman li{margin-bottom:4px}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.evcard{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#e2352b,#ee6a12 60%,#f6b21a);box-shadow:0 8px 24px rgba(226,53,43,.18)}
.evcard h3{font-family:var(--f-display);font-size:20px;font-weight:800;color:#fff}
.evcard.big h3{font-size:24px}
.evcard .ev-info{opacity:.92}
.ev-top{display:flex;gap:6px;flex-wrap:wrap}
.ev-tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.22)}
.ev-tag.live{background:#fff;color:#e2352b}.ev-tag.prem{background:#1d2a3a}
.evcard .cta{background:#fff;color:#c2410c}
.evcard .pill.good{background:rgba(255,255,255,.9)}
.liga{border-left:6px solid var(--lc)}
.liga-badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--lc,var(--brand));font-family:var(--f-display);font-size:18px}
.liga-badge.big{width:64px;height:64px;font-size:28px}
.akun-h{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:12px 8px;border:1px solid var(--line);border-radius:14px;opacity:.45;filter:grayscale(1)}
.badge.ok{opacity:1;filter:none;background:color-mix(in srgb,#f2b51d 10%,var(--card));border-color:color-mix(in srgb,#f2b51d 45%,var(--line))}
.badge span{font-size:28px}.badge b{font-size:13px}.badge small{font-size:11px;color:var(--muted)}
.code-box{font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:.2em;padding:10px 16px;border:2px dashed var(--brand);border-radius:12px;align-self:flex-start;color:var(--brand)}

.chips-row{display:flex;flex-wrap:wrap;gap:8px}
.chip-s{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600}
.chip-s.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.drill{border-left:5px solid var(--cta)}
.rekom{padding:10px 0;border-bottom:1px solid var(--line)}.rekom:last-child{border-bottom:0}
.tka-banner{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:linear-gradient(100deg,#14233a,#1767c2);color:#fff;text-decoration:none}
.tka-banner .tb-n{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;color:#ffd34d}
.tka-hero{display:flex;flex-direction:column;gap:12px;padding:26px 22px;border-radius:24px;color:#fff;background:var(--hero)}
.tka-hero h1{color:#fff;font-size:30px;max-width:22ch}.tka-hero p{opacity:.92;max-width:52ch}
.tka-count{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tka-count>div:not(.tc-note){background:rgba(255,255,255,.16);border-radius:14px;padding:10px 16px;display:flex;flex-direction:column;align-items:center;min-width:86px}
.tka-count b{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.1}.tka-count span{font-size:12px;opacity:.9}
.tc-note{opacity:.9}
.kisi{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.step{text-decoration:none;color:var(--ink)}.step:hover{border-color:var(--brand)}
.step-n{width:30px;height:30px;border-radius:50%;background:var(--cta);color:#fff;display:grid;place-items:center;font-weight:800}
.faq details{border-bottom:1px solid var(--line);padding:12px 2px}.faq details:last-child{border-bottom:0}
.faq summary{cursor:pointer;font-weight:700}.faq details p{margin-top:8px;color:var(--muted)}
@media (max-width:520px){.hm{display:none}}
/* format table */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.me td{background:var(--brand-soft)}
.tablewrap{overflow-x:auto}

/* mapel cards */
.mcard{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.mcard .meta{display:flex;gap:6px;flex-wrap:wrap}
.mcard .bar{height:6px;border-radius:9px;background:var(--paper);overflow:hidden}
.mcard .bar span{display:block;height:100%;background:var(--brand)}
.mstripe{width:34px;height:4px;border-radius:4px;background:var(--brand)}
.mstripe.pil{background:var(--accent)}

/* question */
.q{display:flex;flex-direction:column;gap:14px}
.q-stim{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:15px;max-width:75ch}
.q-text{font-size:16px;max-width:75ch}
.q-text table,.q-stim table{border-collapse:collapse;margin:6px 0}
.q-text td,.q-text th,.q-stim td,.q-stim th{border:1px solid var(--line);padding:4px 8px}
.opts{display:flex;flex-direction:column;gap:8px;max-width:75ch}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);text-align:left;width:100%}
.opt:hover{border-color:color-mix(in srgb,var(--brand) 50%,var(--line))}
.opt .lt{flex:0 0 28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--paper);font-size:13px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .lt{background:var(--brand);color:var(--brand-ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .lt{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .lt{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.chk .lt{border-radius:6px}
.bs{width:100%;border-collapse:separate;border-spacing:0 6px;max-width:75ch}
.bs td{padding:10px 12px;background:var(--card);border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
.bs td:first-child{border-left:1.5px solid var(--line);border-radius:10px 0 0 10px}
.bs td:last-child{border-right:1.5px solid var(--line);border-radius:0 10px 10px 0;white-space:nowrap;width:1%}
.bs tr.ok td{background:var(--good-soft);border-color:var(--good)}
.bs tr.no td{background:var(--bad-soft);border-color:var(--bad)}
.tog{padding:6px 12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:13px}
.tog:first-child{border-radius:8px 0 0 8px}
.tog:last-child{border-radius:0 8px 8px 0;border-left:0}
.tog.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.expl{border-left:4px solid var(--brand);background:var(--brand-soft);padding:12px 16px;border-radius:0 10px 10px 0;max-width:75ch}
.expl h3{margin-bottom:4px}

/* exam */
.exam{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column}
.exam-top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.exam-top .ttl{flex:1;min-width:160px}
.timer{font-family:var(--f-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;padding:4px 14px;border-radius:10px;background:var(--brand-soft);color:var(--brand)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.exam-body{flex:1;display:grid;grid-template-columns:1fr 290px;gap:16px;padding:16px;overflow:hidden;max-width:1240px;width:100%;margin:0 auto}
.exam-q{overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.exam-side{overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.numgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nb{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.nb.ans{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.nb.rg{background:var(--accent);border-color:var(--accent);color:#2a1a00}
.nb.cur{outline:2.5px solid var(--ink);outline-offset:1px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--line);display:inline-block}
.exam-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.exam.big .q-text,.exam.big .q-stim,.exam.big .opt{font-size:18px}
@media (max-width:820px){
  .exam-body{grid-template-columns:1fr;overflow-y:auto;padding:10px}
  .exam-q{overflow:visible}
  .exam-side{overflow:visible}
}

/* result */
.score-ring{width:150px;height:150px;flex:0 0 150px}
.reshead{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.hbar{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:14px}
.hbar .tr{height:10px;background:var(--paper);border-radius:9px;overflow:hidden}
.hbar .tr span{display:block;height:100%;border-radius:9px}
@media (max-width:520px){.hbar{grid-template-columns:110px 1fr 48px}}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--paper);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);width:100%}
textarea.input{min-height:90px;resize:vertical;font-family:var(--f-body)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.rank{font-family:var(--f-display);font-weight:800;width:32px;display:inline-block}
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(10,20,17,.5);display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:16px;padding:22px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:90vw}
.qcard{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--card);display:flex;flex-direction:column;gap:12px}
.dotprog{display:flex;gap:4px;flex-wrap:wrap}
.dotprog button{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);background:var(--card);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.dotprog button.ok{background:var(--good);border-color:var(--good);color:#fff}
.dotprog button.no{background:var(--bad);border-color:var(--bad);color:#fff}
.dotprog button.cur{outline:2.5px solid var(--ink);outline-offset:1px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="adapter.js"></script>

<script>
"use strict";
/* ====================== KONFIGURASI ====================== */
const JENJANG = "sd";
const MAPEL = {
  bind:{nama:"Bahasa Indonesia",sub:"Bahasa Indonesia & Literasi",grup:"wajib",soal:30,menit:75},
  mat:{nama:"Matematika",sub:"Matematika & Numerasi",grup:"wajib",soal:30,menit:75}
};
const TIPE = {pg:"Pilihan ganda",pgk:"Pilihan ganda kompleks",bs:"Benar–Salah"};
const LETTERS = "ABCDE";
const NAV = [
  ["beranda","Beranda",'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',1],
  ["tryout","Tryout",'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',1],
  ["belajar","Belajar",'<path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/>',1],
  ["tka","TKA SD",'<path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M6 10v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>'],
  ["harian","Latihan Harian",'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
  ["tanya","Tanya Soal",'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17h.01"/>',1],
  ["bank","Bank Soal",'<path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>'],
  ["ranking","Ranking",'<path d="M8 21V11M12 21V5M16 21v-7"/>'],
  ["rapor","Rapor",'<path d="M4 19l5-6 4 3 7-9"/>'],
  ["akun","Akun",'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',1]
];

/* ====================== STATE ====================== */
const S = {
  db:null,user:null,uid:null,isOwner:false,myName:"",
  ready:false,offline:false,slow:false,readonly:false,
  bankDocs:[],soal:[],byId:{},
  scores:[],mine:[],
  names:{},
  view:"beranda",
  exam:null,result:null,practice:null,
  ui:{bankMapel:"",bankTopik:"",bankQ:"",bankTanggal:"",bankOpen:{},rankTab:"poin",harianTanggal:"",rapor:null,admin:{},jenjang:load("siaptka-jenjang"),stickerOff:false}
};

/* ====================== UTIL ====================== */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ALLOWED = new Set(["B","I","U","EM","STRONG","SUP","SUB","BR","P","UL","OL","LI","TABLE","THEAD","TBODY","TR","TD","TH","BLOCKQUOTE","SPAN","CODE","PRE","SMALL"]);
function cleanNode(n){
  [...n.childNodes].forEach(ch=>{
    if(ch.nodeType===1){
      cleanNode(ch);
      if(!ALLOWED.has(ch.tagName)){ ch.replaceWith(...ch.childNodes); }
      else { [...ch.attributes].forEach(a=>ch.removeAttribute(a.name)); }
    } else if(ch.nodeType!==3){ ch.remove(); }
  });
}
function rich(html){
  const src = String(html==null?"":html).replace(/\n/g,"<br>");
  const doc = new DOMParser().parseFromString("<div>"+src+"</div>","text/html");
  const root = doc.body.firstElementChild || doc.body;
  cleanNode(root);
  return root.innerHTML;
}
const todayStr = () => { const d=new Date(); const o=d.getTimezoneOffset(); return new Date(d.getTime()-o*60000).toISOString().slice(0,10); };
const fmtTgl = s => { if(!s) return ""; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short",year:"numeric"}); };
const fmtWaktu = iso => { try{return new Date(iso).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}catch(e){return "";} };
const mm = s => { s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(x).padStart(2,"0"); };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const r1 = x => Math.round(x*10)/10;
const mapelNama = k => (MAPEL[k]&&MAPEL[k].nama) || k || "Lainnya";
function store(k,v){ try{ if(v===undefined) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function load(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function toast(msg){ const el=document.createElement("div"); el.className="toast"; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),3200); }

/* ====================== JAWABAN & PENILAIAN ====================== */
function answered(q,v){
  if(v==null) return false;
  if(q.tipe==="pgk") return Array.isArray(v) && v.length>0;
  if(q.tipe==="bs") return Array.isArray(v) && v.some(x=>x===true||x===false);
  return typeof v==="number";
}
function correct(q,v){
  if(!answered(q,v)) return false;
  if(q.tipe==="pgk"){ const a=[...v].sort().join(","), k=[...(q.kunci||[])].sort().join(","); return a===k; }
  if(q.tipe==="bs"){ const k=q.kunci||[]; return k.length===v.length && k.every((x,i)=>x===v[i]); }
  return v===q.kunci;
}
function kunciText(q){
  if(q.tipe==="pgk") return (q.kunci||[]).map(i=>LETTERS[i]).join(", ");
  if(q.tipe==="bs") return (q.kunci||[]).map((x,i)=>(i+1)+": "+(x?"Benar":"Salah")).join(" · ");
  return LETTERS[q.kunci] || "-";
}
function jawabText(q,v){
  if(!answered(q,v)) return "Tidak dijawab";
  if(q.tipe==="pgk") return [...v].sort().map(i=>LETTERS[i]).join(", ");
  if(q.tipe==="bs") return v.map((x,i)=>(i+1)+": "+(x===true?"Benar":x===false?"Salah":"–")).join(" · ");
  return LETTERS[v];
}
function validSoal(q){
  if(!q||typeof q!=="object"||!q.id||!q.teks||!Array.isArray(q.opsi)||q.opsi.length<2) return false;
  if(q.tipe==="pgk") return Array.isArray(q.kunci);
  if(q.tipe==="bs") return Array.isArray(q.kunci) && q.kunci.length===q.opsi.length;
  return typeof q.kunci==="number";
}

/* ====================== DATA TURUNAN ====================== */
function rebuildBank(){
  const all=[];
  S.bankDocs.forEach(d=>{
    const b=d.data||{};
    if(b.jenjang!==JENJANG) return;
    (Array.isArray(b.soal)?b.soal:[]).forEach(q=>{
      if(!validSoal(q)||!MAPEL[q.mapel]) return;
      all.push(Object.assign({},q,{tipe:q.tipe||"pg",tanggal:q.tanggal||b.tanggal||"",docId:d.id,sumber:b.sumber||""}));
    });
  });
  all.sort((a,b)=> (b.tanggal||"").localeCompare(a.tanggal||"") || String(a.id).localeCompare(String(b.id)));
  S.soal=all; S.byId={}; all.forEach(q=>S.byId[q.id]=q);
}
const myAttempts = () => S.mine.filter(d=>d.data.jenis==="tryout").map(d=>Object.assign({_id:d.id},d.data)).sort((a,b)=>(a.selesai||"").localeCompare(b.selesai||""));
const myHarian = () => S.mine.filter(d=>d.data.jenis==="harian").map(d=>Object.assign({_id:d.id},d.data));
function harianDates(){
  const set=new Set(); S.bankDocs.forEach(d=>{ const b=d.data||{}; if(b.jenjang===JENJANG && b.sumber==="harian" && b.tanggal) set.add(b.tanggal); });
  return [...set].sort().reverse();
}
const harianSoal = tgl => S.soal.filter(q=>q.sumber==="harian" && q.tanggal===tgl).sort((a,b)=>String(a.id).localeCompare(String(b.id)));
function streak(){
  const done=new Set(myHarian().filter(h=>Object.keys(h.cek||{}).length>0).map(h=>h.tanggal));
  let d=new Date(); let n=0;
  const key = x => { const o=x.getTimezoneOffset(); return new Date(x.getTime()-o*60000).toISOString().slice(0,10); };
  if(!done.has(key(d))) d.setDate(d.getDate()-1);
  while(done.has(key(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function computeMyScore(){
  const tr=myAttempts(); const best={};
  tr.forEach(a=>{ const b=best[a.mapel]; if(!b||a.skor>b.skor||(a.skor===b.skor&&a.selesai<b.at)) best[a.mapel]={skor:a.skor,at:a.selesai}; });
  let benarH=0; myHarian().forEach(h=>{ benarH+=Object.values(h.cek||{}).filter(x=>x===true).length; });
  const benarT=tr.reduce((s,a)=>s+(a.benar||0),0);
  const skorList=tr.map(a=>a.skor);
  const res={best,tryout:tr.length,rata:skorList.length?r1(skorList.reduce((a,b)=>a+b,0)/skorList.length):0,poin:benarT*10+benarH*5,streak:streak(),harianBenar:benarH};
  return window.FX ? FX.extendScore(res) : res;
}
async function syncScore(){
  if(!S.db||!S.uid||S.readonly) return;
  const sc=computeMyScore();
  const cur=S.scores.find(d=>d.id===S.uid);
  const strip=o=>JSON.stringify(Object.assign({},o,{updatedAt:0}));
  if(cur && strip(cur.data)===strip(sc)) return;
  sc.updatedAt=new Date().toISOString();
  try{ await S.db.doc("scores/"+S.uid).set(sc); }catch(e){ handleWriteErr(e); }
}
function handleWriteErr(e){
  console.warn(e);
  if(e && e.code==="invalid_argument"){ S.readonly=true; render(); toast("Hasil tidak tersimpan: akunmu belum punya izin menyimpan."); }
  else if(e && e.code==="quota_exceeded"){ toast("Penyimpanan penuh: "+(e.message||"hapus sebagian data.")); }
  else toast("Gagal menyimpan. Coba lagi sebentar lagi.");
}
async function resolveNames(ids){
  if(!S.user||!ids.length) return;
  const need=ids.filter(i=>!(i in S.names)); if(!need.length) return;
  try{ const ps=await S.user.profiles(need); need.forEach(i=>{ S.names[i]=(ps&&ps[i]&&ps[i].name)||""; }); render(); }catch(e){}
}

/* ====================== INIT ====================== */
async function init(){
  window.addEventListener("hashchange",()=>{ S.view=(location.hash||"#beranda").slice(1)||"beranda"; S.practice=null; S.result=null; render(); window.scrollTo(0,0); });
  S.view=(location.hash||"#beranda").slice(1)||"beranda";
  render();
  if(!S.ui.jenjang && S.view==="beranda") setTimeout(openJenjang,400);
  if(!window.claude||typeof window.claude.use!=="function"){ S.offline=true; S.ready=true; render(); return; }
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  S.db=db; S.user=user;
  if(user){ try{ S.isOwner=!!user.isOwner(); }catch(e){} try{ S.uid=await user.id(); }catch(e){} try{ const me=await user.me(); S.myName=(me&&me.name)||""; }catch(e){} }
  if(!db){ S.offline=true; S.ready=true; render(); return; }
  if(!S.uid) S.readonly=true;
  let gotBank=false;
  const timer=setTimeout(()=>{ if(!gotBank){ S.slow=true; render(); } },10000);
  db.collection("bank").onSnapshot(snap=>{
    S.bankDocs=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,data:d.data()}));
    rebuildBank();
    if(!snap.metadata.fromCache){ gotBank=true; clearTimeout(timer); S.slow=false; }
    S.ready=true; render();
  },err=>{ clearTimeout(timer); S.ready=true; S.slow=true; render(); });
  db.collection("scores").onSnapshot(snap=>{
    S.scores=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,data:d.data()}));
    resolveNames(S.scores.map(d=>d.id)); render();
  },()=>{});
  if(S.uid){
    db.collection("data/users/"+S.uid).onSnapshot(snap=>{
      S.mine=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,data:d.data()}));
      if(S._harianLocal && !Object.keys(S._harianLocal.cek).length) S._harianLocal=null;
      render();
    },()=>{});
  }
  if(window.FX) FX.init();
  const saved=load("siaptka-exam");
  if(saved && saved.endsAt && saved.soalIds){ S.pendingExam=saved; render(); }
}

/* ====================== RENDER ====================== */
function render(){
  renderNav();
  if(S.exam){ renderSticker(); renderExam(); return; }
  $("#layer").querySelectorAll(".exam").forEach(e=>e.remove());
  const app=$("#app");
  let html="";
  if(S.offline) html+=`<div class="banner">Database belum tersambung. Pemilik situs perlu mengisi <code>config.js</code> dengan alamat dan anon key Supabase (lihat README).</div>`;
  else if(S.slow) html+=`<div class="banner">Data belum bisa dimuat. Periksa koneksi internetmu; halaman akan memperbarui sendiri saat tersambung.</div>`;
  if(S.readonly && !S.offline) html+=`<div class="banner info spread"><span>Kamu bisa langsung mengerjakan soal. <b>Masuk dengan Google</b> supaya nilai dan riwayatmu tersimpan dan ikut ranking.</span><button class="btn sm primary" data-act="login">Masuk dengan Google</button></div>`;
  if(S.result){ html+=viewResult(); app.innerHTML=html; afterRender(); return; }
  if(S.practice){ html+=viewPractice(); app.innerHTML=html; afterRender(); return; }
  const v=S.view;
  if(v==="tryout") html+=viewTryout();
  else if(v==="harian") html+=viewHarian();
  else if(v==="bank") html+=viewBank();
  else if(v==="ranking") html+=viewRanking();
  else if(v==="rapor") html+=viewRapor();
  else if(v==="admin" && S.isOwner) html+=viewAdmin();
  else if(window.FX && FX.view(v)!=null) html+=FX.view(v);
  else html+=viewBeranda();
  app.innerHTML=html;
  afterRender();
}

function startExam(k){
  const m=MAPEL[k]; const pool=S.soal.filter(q=>q.mapel===k);
  if(!pool.length) return;
  const ids=shuffle(pool).slice(0,m.soal).map(q=>q.id);
  const menit=Math.max(3,Math.round(m.menit*ids.length/m.soal));
  S.exam={mapel:k,soalIds:ids,jawaban:{},ragu:{},idx:0,mulai:Date.now(),endsAt:Date.now()+menit*60000,menit,big:false};
  S.pendingExam=null; saveExam(); render();
}
function saveExam(){ store("siaptka-exam",S.exam||undefined); }
let tick=null;
function renderExam(){
  const E=S.exam; const ids=E.soalIds.filter(id=>S.byId[id]);
  if(!ids.length){ S.exam=null; saveExam(); render(); return; }
  if(E.idx>=ids.length) E.idx=ids.length-1;
  const q=S.byId[ids[E.idx]]; const v=E.jawaban[q.id];
  const nAns=ids.filter(id=>answered(S.byId[id],E.jawaban[id])).length;
  let el=$("#layer .exam");
  if(!el){ el=document.createElement("div"); el.className="exam"; $("#layer").appendChild(el); }
  el.classList.toggle("big",!!E.big);
  el.innerHTML=`
    <div class="exam-top">
      <div class="ttl"><div class="small muted">Tryout TKA</div><h2>${esc(mapelNama(E.mapel))}</h2></div>
      <button class="btn sm" data-act="font" aria-pressed="${E.big?"true":"false"}">${E.big?"Huruf normal":"Perbesar huruf"}</button>
      <div class="timer num" id="timer" aria-live="off">${mm((E.endsAt-Date.now())/1000)}</div>
      <button class="btn accent" data-act="askfinish">Selesai</button>
    </div>
    <div class="exam-body">
      <div class="exam-q">
        <div class="spread" style="margin-bottom:14px"><span class="pill brand num">Soal ${E.idx+1} dari ${ids.length}</span><span class="row"><span class="pill">${esc(TIPE[q.tipe]||"")}</span>${q.topik?`<span class="pill">${esc(q.topik)}</span>`:""}</span></div>
        ${questionHTML(q,v,{mode:"exam"})}
        <div class="exam-foot">
          <button class="btn" data-act="prev" ${E.idx===0?"disabled":""}>‹ Sebelumnya</button>
          <button class="btn ${E.ragu[q.id]?"accent":""}" data-act="ragu" aria-pressed="${E.ragu[q.id]?"true":"false"}">${E.ragu[q.id]?"Ditandai ragu-ragu":"Ragu-ragu"}</button>
          ${E.idx<ids.length-1?`<button class="btn primary" data-act="next">Berikutnya ›</button>`:`<button class="btn primary" data-act="askfinish">Selesai</button>`}
        </div>
      </div>
      <aside class="exam-side">
        <div class="spread"><h3>Nomor soal</h3><span class="small muted num">${nAns}/${ids.length} terjawab</span></div>
        <div class="numgrid">${ids.map((id,i)=>{ const qq=S.byId[id]; const a=answered(qq,E.jawaban[id]); return `<button class="nb num ${E.ragu[id]?"rg":a?"ans":""} ${i===E.idx?"cur":""}" data-act="goto" data-i="${i}" aria-label="Soal ${i+1}">${i+1}</button>`; }).join("")}</div>
        <div class="legend"><span><i style="background:var(--brand);border-color:var(--brand)"></i>Terjawab</span><span><i style="background:var(--accent);border-color:var(--accent)"></i>Ragu-ragu</span><span><i></i>Belum dijawab</span><span><i style="outline:2px solid var(--ink)"></i>Sedang dibuka</span></div>
        <p class="small muted">Jawaban tersimpan otomatis di perangkat ini. Saat waktu habis, jawaban dikumpulkan otomatis.</p>
      </aside>
    </div>`;

    if(!S.exam){ clearInterval(tick); tick=null; return; }
    const left=(S.exam.endsAt-Date.now())/1000; const t=$("#timer");

  },1000);

function questionHTML(q,v,o){

  const show=o.reveal;

    body=`<table class="bs"><tbody>${q.opsi.map((s,i)=>{
      const cur=Array.isArray(v)?v[i]:null; let cls="";
      if(show){ cls=(cur==null)?"":(cur===q.kunci[i])?"ok":"no"; }
      return `<tr class="${cls}"><td><span class="muted num">${i+1}.</span> ${rich(s)}${show?`<div class="small" style="margin-top:4px"><b>Kunci: ${q.kunci[i]?"Benar":"Salah"}</b></div>`:""}</td><td><span style="display:inline-flex"><button class="tog ${cur===true?"on":""}" data-act="bs" data-i="${i}" data-v="1" ${show?"disabled":""} aria-pressed="${cur===true}">Benar</button><button class="tog ${cur===false?"on":""}" data-act="bs" data-i="${i}" data-v="0" ${show?"disabled":""} aria-pressed="${cur===false}">Salah</button></span></td></tr>`;
    }).join("")}</tbody></table>`;
  } else {
    const multi=q.tipe==="pgk";
    body=`<div class="opts" role="${multi?"group":"radiogroup"}">${q.opsi.map((s,i)=>{
      const sel=multi?(Array.isArray(v)&&v.includes(i)):v===i;
      let cls=sel?"sel":"";
      if(show){ const isK=multi?(q.kunci||[]).includes(i):q.kunci===i; cls=isK?"ok":(sel?"no":""); }
      return `<button class="opt ${multi?"chk":""} ${cls}" data-act="pick" data-i="${i}" ${show?"disabled":""} role="${multi?"checkbox":"radio"}" aria-checked="${sel}"><span class="lt">${LETTERS[i]}</span><span>${rich(s)}</span></button>`;
    }).join("")}</div>`;
    if(multi && !show) body=`<p class="small muted">Pilih semua jawaban yang benar (bisa lebih dari satu).</p>`+body;
  }
  if(q.tipe==="bs" && !show) body=`<p class="small muted">Tentukan setiap pernyataan benar atau salah.</p>`+body;
  return `<div class="q">
    ${q.stimulus?`<div class="q-stim">${rich(q.stimulus)}</div>`:""}
    <div class="q-text">${rich(q.teks)}</div>
    ${body}
    ${show?`<div class="expl"><h3>Pembahasan</h3>${mode==="review"?`<p class="small" style="margin-bottom:6px">Jawabanmu: <b>${esc(jawabText(q,v))}</b> · Kunci: <b>${esc(kunciText(q))}</b></p>`:""}<div>${rich(q.pembahasan||"Pembahasan belum tersedia.")}</div></div>`:""}
  </div>`;
}
function setAnswer(target,q,i,val){
  let v=target[q.id];
  if(q.tipe==="pgk"){ v=Array.isArray(v)?v.slice():[]; v=v.includes(i)?v.filter(x=>x!==i):[...v,i].sort(); }
  else if(q.tipe==="bs"){ v=Array.isArray(v)?v.slice():q.opsi.map(()=>null); v[i]=(v[i]===val)?null:val; }
  else { v=(v===i)?undefined:i; }
  if(v===undefined) delete target[q.id]; else target[q.id]=v;
}

/* ---------- HASIL ---------- */
function ring(p){

  return `<svg class="score-ring" viewBox="0 0 150 150" role="img" aria-label="Skor ${p}"><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--paper)" stroke-width="14"/><circle cx="75" cy="75" r="${R}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 75 75)"/><text x="75" y="80" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="34" fill="var(--ink)">${p}</text><text x="75" y="102" text-anchor="middle" font-size="12" fill="var(--muted)">dari 100</text></svg>`;
}
function topicStats(ids,jaw){
  const t={}; ids.forEach(id=>{ const q=S.byId[id]; if(!q) return; const k=q.topik||"Umum"; t[k]=t[k]||{b:0,n:0}; t[k].n++; if(correct(q,jaw[id])) t[k].b++; });
  return Object.entries(t).sort((a,b)=>a[1].b/a[1].n-b[1].b/b[1].n);
}
function viewResult(){
  const R=S.result;
  if(R.event && window.FX && !FX.announced(R.event)) return FX.pendingResult(R); const ids=R.soalIds.filter(id=>S.byId[id]);

    </div>
  </div></section>
  <section class="card"><div class="card-h"><h2>Analisis per topik</h2><span class="muted small">Urut dari yang paling perlu dilatih</span></div>
    <div class="stack">${ts.map(([k,s])=>{ const p=Math.round(s.b/s.n*100); return `<div class="hbar"><span>${esc(k)}</span><span class="tr"><span style="width:${Math.max(p,2)}%;background:${p>=75?"var(--good)":p>=50?"var(--accent)":"var(--bad)"}"></span></span><span class="num small" style="text-align:right">${s.b}/${s.n}</span></div>`; }).join("")}</div>

/* ---------- RAPOR ---------- */
function lineChart(pts){
  if(pts.length<2) return `<div class="empty">Grafik muncul setelah kamu menyelesaikan minimal 2 tryout.</div>`;
  const W=640,H=200,L=34,Rr=12,T=12,B=26; const n=pts.length;
  const x=i=>L+(W-L-Rr)*(n===1?0.5:i/(n-1)); const y=v=>T+(H-T-B)*(1-v/100);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.skor).toFixed(1)}`).join(" ");
  const area=line+` L${x(n-1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
  const last=pts[n-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Grafik skor tryout">
    ${[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("")}
    <path d="${area}" fill="var(--brand)" opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.skor)}" r="${i===n-1?5:3}" fill="${i===n-1?"var(--accent)":"var(--brand)"}"><title>${esc(mapelNama(p.mapel))}: ${p.skor}</title></circle>`).join("")}
    <text x="${x(0)}" y="${H-6}">Tryout ke-1</text><text x="${x(n-1)}" y="${H-6}" text-anchor="end">ke-${n} · skor ${last.skor}</text>
  </svg>`;
}
function viewRapor(){
  const tr=myAttempts(); const sc=computeMyScore();
  const allT={}; tr.forEach(a=>{ topicStats(a.soalIds||[],a.jawaban||{}).forEach(([k,s])=>{ const key=mapelNama(a.mapel)+" · "+k; allT[key]=allT[key]||{b:0,n:0}; allT[key].b+=s.b; allT[key].n+=s.n; }); });
  myHarian().forEach(h=>{ Object.entries(h.cek||{}).forEach(([id,ok])=>{ const q=S.byId[id]; if(!q) return; const key=mapelNama(q.mapel)+" · "+(q.topik||"Umum"); allT[key]=allT[key]||{b:0,n:0}; allT[key].n++; if(ok) allT[key].b++; }); });
  const weak=Object.entries(allT).filter(([,s])=>s.n>=1).sort((a,b)=>a[1].b/a[1].n-b[1].b/b[1].n||b[1].n-a[1].n).slice(0,6);
  const bests=Object.entries(sc.best);
  return `
  <div class="stack" style="gap:4px"><h1>Rapor</h1><p class="muted">Perkembangan nilaimu dari tryout dan latihan harian.</p></div>
  <section class="card grid g4">
    <div class="stat"><span class="v">${sc.tryout}</span><span class="k">Tryout selesai</span></div>
    <div class="stat"><span class="v">${sc.tryout?sc.rata:"–"}</span><span class="k">Rata-rata skor</span></div>
    <div class="stat"><span class="v">${sc.harianBenar}</span><span class="k">Benar di latihan harian</span></div>
    <div class="stat"><span class="v">${sc.poin.toLocaleString("id-ID")}</span><span class="k">Total poin</span></div>
  </section>
  <section class="card"><div class="card-h"><h2>Tren skor tryout</h2></div>${lineChart(tr)}</section>
  <section class="grid g2">
    <div class="card"><div class="card-h"><h2>Skor terbaik per mapel</h2></div>
      ${bests.length?`<div class="stack">${bests.map(([k,b])=>`<div class="hbar"><span>${esc(mapelNama(k))}</span><span class="tr"><span style="width:${Math.max(b.skor,2)}%;background:var(--brand)"></span></span><span class="num small" style="text-align:right">${b.skor}</span></div>`).join("")}</div>`:`<div class="empty">Belum ada tryout.</div>`}
    </div>
    <div class="card"><div class="card-h"><h2>Topik yang perlu dilatih</h2></div>
      ${weak.length?`<div class="stack">${weak.map(([k,s])=>{ const p=Math.round(s.b/s.n*100); return `<div class="hbar"><span class="small">${esc(k)}</span><span class="tr"><span style="width:${Math.max(p,2)}%;background:${p>=75?"var(--good)":p>=50?"var(--accent)":"var(--bad)"}"></span></span><span class="num small" style="text-align:right">${p}%</span></div>`; }).join("")}</div>`:`<div class="empty">Kerjakan soal untuk melihat analisis topik.</div>`}
    </div>
  </section>
  ${window.FX?FX.rekomBlock():""}
  ${historyTable(tr.slice().reverse(),"Riwayat tryout")}`;
}

/* ---------- ADMIN ---------- */
function viewAdmin(){
  const A=S.ui.admin; const counts={}; S.soal.forEach(q=>counts[q.mapel]=(counts[q.mapel]||0)+1);
  const docs=S.bankDocs.filter(d=>(d.data||{}).jenjang===JENJANG).sort((a,b)=>b.id.localeCompare(a.id));
  return `
  <div class="stack" style="gap:4px"><h1>Kelola Soal</h1><p class="muted">Hanya kamu sebagai pemilik yang melihat halaman ini. Soal harian SD (10 Bahasa Indonesia + 10 Matematika) ditambahkan otomatis setiap pagi; di sini kamu bisa menambah soal sendiri atau mengimpor JSON.</p></div>
  <section class="card"><div class="card-h"><h2>Isi bank soal</h2><span class="pill brand num">${S.soal.length} soal</span></div>
    <div class="tablewrap"><table class="t"><thead><tr><th>Mapel</th><th style="text-align:right">Jumlah</th><th style="text-align:right">Target 1 paket</th></tr></thead><tbody>${Object.keys(MAPEL).map(k=>`<tr><td>${esc(MAPEL[k].nama)}</td><td class="n">${counts[k]||0}</td><td class="n">${MAPEL[k].soal}</td></tr>`).join("")}</tbody></table></div>
  </section>
  <section class="card stack"><h2>Tambah soal</h2>
    <div class="grid g3">
      <div class="field"><label for="aM">Mata pelajaran</label><select id="aM" class="input">${Object.keys(MAPEL).map(k=>`<option value="${k}" ${A.mapel===k?"selected":""}>${esc(MAPEL[k].nama)}</option>`).join("")}</select></div>
      <div class="field"><label for="aT">Topik</label><input id="aT" class="input" placeholder="mis. Statistika" value="${esc(A.topik||"")}"></div>
      <div class="field"><label for="aY">Tipe soal</label><select id="aY" class="input">${Object.entries(TIPE).map(([k,l])=>`<option value="${k}" ${A.tipe===k?"selected":""}>${l}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label for="aS">Teks bacaan/stimulus (opsional)</label><textarea id="aS" class="input">${esc(A.stimulus||"")}</textarea></div>
    <div class="field"><label for="aQ">Pertanyaan</label><textarea id="aQ" class="input">${esc(A.teks||"")}</textarea></div>
    <div class="field"><label for="aO">Opsi jawaban, satu per baris (untuk Benar–Salah: satu pernyataan per baris)</label><textarea id="aO" class="input">${esc(A.opsi||"")}</textarea></div>
    <div class="field"><label for="aK">Kunci: PG = huruf (C) · PG kompleks = huruf dipisah koma (A,C) · Benar–Salah = B/S per baris dipisah koma (B,S,B)</label><input id="aK" class="input" value="${esc(A.kunci||"")}"></div>
    <div class="field"><label for="aP">Pembahasan</label><textarea id="aP" class="input">${esc(A.pembahasan||"")}</textarea></div>
    <div class="row"><button class="btn primary" data-act="aadd">Simpan soal</button><span class="small muted">Tag yang boleh dipakai: &lt;b&gt;, &lt;i&gt;, &lt;sup&gt;, &lt;sub&gt;, &lt;br&gt;, tabel sederhana.</span></div>
  </section>
  <section class="card stack"><h2>Impor JSON</h2>
    <p class="small muted">Tempel isi file cadangan Eduvara, atau array soal dengan field: mapel, topik, tipe (pg/pgk/bs), teks, stimulus, opsi[], kunci, pembahasan.</p>
    <textarea id="aJ" class="input" style="min-height:120px;font-family:ui-monospace,monospace;font-size:13px" placeholder='[{"mapel":"mat","topik":"Peluang","tipe":"pg","teks":"…","opsi":["…","…"],"kunci":1,"pembahasan":"…"}]'></textarea>
    <div><button class="btn" data-act="aimport">Impor</button></div>
  </section>
  ${window.FX?FX.adminBlock():""}
  <section class="card stack"><h2>Cadangan bank soal</h2>
    <p class="small muted">Unduh semua paket soal sebagai satu file JSON. File ini bisa dipulihkan lewat kotak Impor JSON di atas (di situs ini atau situs Eduvara lain).</p>
    <div><button class="btn" data-act="abackup">Unduh cadangan (JSON)</button></div>
  </section>
  <section class="card"><div class="card-h"><h2>Paket di database</h2></div>
    ${docs.length?`<div class="tablewrap"><table class="t"><thead><tr><th>Paket</th><th>Sumber</th><th style="text-align:right">Soal</th><th></th></tr></thead><tbody>${docs.map(d=>`<tr><td class="num">${esc(fmtTgl(d.data.tanggal))}</td><td>${d.data.sumber==="harian"?"Otomatis harian":"Tambahan manual"}</td><td class="n">${(d.data.soal||[]).length}</td><td style="text-align:right"><button class="btn sm danger" data-act="adel" data-id="${esc(d.id)}">Hapus paket</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Belum ada paket soal.</div>`}
  </section>`;
}
function readAdminForm(){
  const g=id=>($("#"+id)||{}).value||"";
  S.ui.admin={mapel:g("aM"),topik:g("aT"),tipe:g("aY"),stimulus:g("aS"),teks:g("aQ"),opsi:g("aO"),kunci:g("aK"),pembahasan:g("aP")};
  return S.ui.admin;
}
async function appendManual(items){
  const tgl=todayStr(); const id=JENJANG+"-m-"+tgl; const ref=S.db.doc("bank/"+id);
  const snap=await ref.get(); const cur=snap.exists?(snap.data().soal||[]):[];
  await ref.set({tanggal:tgl,jenjang:JENJANG,sumber:"manual",soal:cur.concat(items)});
}
async function adminAdd(){
  const A=readAdminForm();
  const opsi=A.opsi.split("\n").map(s=>s.trim()).filter(Boolean);
  let kunci; const kk=A.kunci.toUpperCase().replace(/\s/g,"");
  if(A.tipe==="pg") kunci=LETTERS.indexOf(kk);
  else if(A.tipe==="pgk") kunci=kk.split(",").filter(Boolean).map(x=>LETTERS.indexOf(x)).sort();
  else kunci=kk.split(",").filter(Boolean).map(x=>x==="B");
  const q={id:"m"+Date.now().toString(36),mapel:A.mapel,topik:A.topik.trim()||"Umum",tipe:A.tipe,stimulus:A.stimulus.trim(),teks:A.teks.trim(),opsi,kunci,pembahasan:A.pembahasan.trim(),tanggal:todayStr()};
  const bad=!q.teks?"Pertanyaan masih kosong.":opsi.length<2?"Isi minimal 2 opsi.":(A.tipe==="pg"&&(kunci<0||kunci>=opsi.length))?"Kunci harus salah satu huruf opsi.":(A.tipe==="pgk"&&(!kunci.length||kunci.some(i=>i<0||i>=opsi.length)))?"Kunci PG kompleks tidak cocok dengan opsi.":(A.tipe==="bs"&&kunci.length!==opsi.length)?"Jumlah kunci B/S harus sama dengan jumlah pernyataan.":"";
  if(bad){ toast(bad); return; }
  try{ await appendManual([q]); S.ui.admin={mapel:A.mapel,tipe:A.tipe,topik:A.topik}; toast("Soal tersimpan."); render(); }catch(e){ handleWriteErr(e); }
}
function adminBackup(){
  const docs=S.bankDocs.filter(d=>(d.data||{}).jenjang===JENJANG).map(d=>({id:d.id,data:d.data}));
  const blob=new Blob([JSON.stringify({format:"siaptka-bank",version:1,exported:new Date().toISOString(),docs},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="siaptka-bank-"+todayStr()+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast(docs.length+" paket diunduh.");
}
async function adminRestore(obj){
  const docs=(obj.docs||[]).filter(d=>d&&typeof d.id==="string"&&/^[\w.-]+$/.test(d.id)&&d.data&&Array.isArray(d.data.soal));
  if(!docs.length){ toast("Cadangan tidak berisi paket soal."); return; }
  let ok=0;
  for(const d of docs){ const soal=d.data.soal.filter(validSoal); try{ await S.db.doc("bank/"+d.id).set({tanggal:d.data.tanggal||todayStr(),jenjang:d.data.jenjang||JENJANG,sumber:d.data.sumber||"manual",soal}); ok++; }catch(e){ handleWriteErr(e); return; } }
  toast(ok+" paket dipulihkan dari cadangan."); const t=$("#aJ"); if(t) t.value="";
}
async function adminImport(){
  let arr; try{ arr=JSON.parse(($("#aJ")||{}).value||""); }catch(e){ toast("JSON tidak valid: "+e.message); return; }
  if(arr && !Array.isArray(arr) && arr.format==="siaptka-bank"){ await adminRestore(arr); return; }
  if(!Array.isArray(arr)) arr=[arr];
  const t=Date.now().toString(36);
  const items=arr.map((q,i)=>Object.assign({tipe:"pg",topik:"Umum"},q,{id:q.id||("m"+t+i),tanggal:todayStr()})).filter(validSoal);
  if(!items.length){ toast("Tidak ada soal valid di JSON."); return; }
  try{ await appendManual(items); toast(items.length+" soal diimpor."+(arr.length>items.length?" "+(arr.length-items.length)+" dilewati karena tidak lengkap.":"")); }catch(e){ handleWriteErr(e); }
}

/* ====================== EVENTS ====================== */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
  const act=b.dataset.act;
  if(b.tagName==="SELECT"||b.tagName==="INPUT") return;
  const E=S.exam;
  switch(act){
    case "start": if(window.FX && !FX.canStartTryout()) break; S.result=null; startExam(b.dataset.m); break;
    case "resume": S.exam=S.pendingExam; S.pendingExam=null; S.exam._done=false; render(); break;
    case "discard": confirmBox("Buang tryout ini?","Jawaban yang sudah kamu isi akan hilang.","Buang",()=>{ S.pendingExam=null; store("siaptka-exam"); closeModal(); render(); },true); break;
    case "font": E.big=!E.big; saveExam(); render(); break;
    case "prev": E.idx--; saveExam(); render(); break;
    case "next": E.idx++; saveExam(); render(); break;
    case "goto": E.idx=+b.dataset.i; saveExam(); render(); break;
    case "ragu": { const id=E.soalIds.filter(x=>S.byId[x])[E.idx]; if(E.ragu[id]) delete E.ragu[id]; else E.ragu[id]=true; saveExam(); render(); break; }
    case "pick": case "bs": {
      const i=+b.dataset.i, val=b.dataset.v==="1";
      if(E){ const q=S.byId[E.soalIds.filter(x=>S.byId[x])[E.idx]]; setAnswer(E.jawaban,q,i,val); saveExam(); render(); }
      else if(S.practice){ const P=S.practice; const q=S.byId[P.ids[P.idx]]; if(q.id in P.cek) return; setAnswer(P.jawaban,q,i,val); render(); }
      else if(S.view==="harian" && S._harianLocal){ const P=S._harianLocal; const q=harianSoal(P.tanggal)[P.idx]; if(!q||q.id in P.cek) return; setAnswer(P.jawaban,q,i,val); render(); }
      break; }
    case "askfinish": {
      const ids=E.soalIds.filter(x=>S.byId[x]); const kos=ids.filter(id=>!answered(S.byId[id],E.jawaban[id])).length; const rg=Object.keys(E.ragu).length;
      confirmBox("Kumpulkan jawaban?",`${kos?`Masih ada <b>${kos} soal kosong</b>. `:""}${rg?`<b>${rg} soal</b> bertanda ragu-ragu. `:""}Setelah dikumpulkan, jawaban tidak bisa diubah.`,"Kumpulkan",()=>finishExam(false));
      break; }
    case "mclose": closeModal(); break;
    case "jenjang": openJenjang(); break;
    case "jclose": setJenjang((S.ui.jenjang&&S.ui.jenjang.k)||6); break;
    case "jbg": if(e.target===b) setJenjang((S.ui.jenjang&&S.ui.jenjang.k)||6); break;
    case "jpick": break;
    case "jkelas": setJenjang(+b.dataset.k); break;
    case "stkoff": S.ui.stickerOff=true; renderSticker(); break;
    case "mok": if(S._mok) S._mok(); break;
    case "closeres": S.result=null; if(b.tagName!=="A"){ render(); } break;
    case "rfilter": S.result.filter=b.dataset.f; render(); break;
    case "review": { const a=myAttempts().find(x=>x._id===b.dataset.id); if(a){ S.result=Object.assign({filter:"semua"},a); render(); window.scrollTo(0,0);} break; }
    case "hgo": S._harianLocal.idx=+b.dataset.i; render(); break;
    case "hprev": S._harianLocal.idx--; render(); break;
    case "hnext": S._harianLocal.idx++; render(); window.scrollTo(0,0); break;
    case "hcek": { const P=S._harianLocal; const q=harianSoal(P.tanggal)[P.idx]; P.cek[q.id]=correct(q,P.jawaban[q.id]); render(); saveHarian(); break; }
    case "pgo": S.practice.idx=+b.dataset.i; render(); break;
    case "pprev": S.practice.idx--; render(); break;
    case "pnext": S.practice.idx++; render(); window.scrollTo(0,0); break;
    case "pcek": { const P=S.practice; const q=S.byId[P.ids[P.idx]]; P.cek[q.id]=correct(q,P.jawaban[q.id]); if(P.onCek) P.onCek(q,P.cek[q.id]); render(); break; }
    case "prac": { const l=bankFiltered(); S.practice={ids:shuffle(l).slice(0,50).map(q=>q.id),idx:0,jawaban:{},cek:{},judul:"Latihan bebas"+(S.ui.bankMapel?" · "+mapelNama(S.ui.bankMapel):"")}; render(); window.scrollTo(0,0); break; }
    case "closeprac": S.practice=null; render(); break;
    case "bopen": S.ui.bankOpen[b.dataset.id]=!S.ui.bankOpen[b.dataset.id]; render(); break;
    case "bmore": S.ui.bankLimit=(S.ui.bankLimit||30)+30; render(); break;
    case "aadd": adminAdd(); break;
    case "aimport": adminImport(); break;
    default: if(window.FX && FX.acts[act]) FX.acts[act](b,e); break;
    case "login": window.SiapAuth.signIn(); break;
    case "logout": confirmBox("Keluar dari akun?","Nilai yang sudah tersimpan tetap aman dan muncul lagi saat kamu masuk kembali.","Keluar",()=>window.SiapAuth.signOut()); break;
    case "abackup": adminBackup(); break;
    case "adel": { const id=b.dataset.id; confirmBox("Hapus paket soal?","Semua soal di paket ini akan dihapus dari bank soal untuk semua siswa.","Hapus",async()=>{ closeModal(); try{ await S.db.doc("bank/"+id).delete(); toast("Paket dihapus."); }catch(err){ handleWriteErr(err); } },true); break; }
  }
});
document.addEventListener("change",e=>{
  const t=e.target; const act=t.dataset&&t.dataset.act; if(!act) return;
  if(act==="htgl"){ S.ui.harianTanggal=t.value; S._harianLocal=null; render(); }
  if(act==="bmapel"){ S.ui.bankMapel=t.value; S.ui.bankTopik=""; S.ui.bankLimit=30; render(); }
  if(act==="btopik"){ S.ui.bankTopik=t.value; S.ui.bankLimit=30; render(); }
  if(act==="btgl"){ S.ui.bankTanggal=t.value; S.ui.bankLimit=30; render(); }
  if(act==="rtab"){ S.ui.rankTab=t.value; render(); }
  if(window.FX && FX.chg[act]) FX.chg[act](t);
});
let bqT=null;
document.addEventListener("input",e=>{
  const t=e.target; if(t.dataset&&t.dataset.act==="bq"){ clearTimeout(bqT); bqT=setTimeout(()=>{ S.ui.bankQ=t.value; S.ui.bankLimit=30; S._focusBankQ=true; render(); },250); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && $("#mdl")) closeModal();
  if(e.key==="Escape" && document.getElementById("jmdl")) setJenjang((S.ui.jenjang&&S.ui.jenjang.k)||6);
  if(S.exam && !$("#mdl") && !/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||""))){
    const n=S.exam.soalIds.filter(x=>S.byId[x]).length;
    if(e.key==="ArrowRight" && S.exam.idx<n-1){ S.exam.idx++; saveExam(); render(); }
    if(e.key==="ArrowLeft" && S.exam.idx>0){ S.exam.idx--; saveExam(); render(); }
  }
});
init();
</script>
